<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#003D7A" />
<meta name="description" content="OmniPOS Toko Hana — Grocery Warungnya Rakyat ID. Kasir offline + toko online terpusat Supabase." />
<title>OmniPOS · Toko Hana — Grocery Warungnya Rakyat ID</title>
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='96' fill='%23003D7A'/%3E%3Ctext x='256' y='340' font-size='280' text-anchor='middle' fill='%23fff' font-family='Arial' font-weight='bold'%3EH%3C/text%3E%3C/svg%3E" />
<style>
/* ============================ THEME (BCA-inspired) ============================ */
:root{
  --navy:#003D7A; --navy-2:#00538C; --blue:#0061B1; --blue-l:#E8F1FA; --blue-ll:#F4F8FC;
  --accent:#0090E0; --accent-2:#00BFA6; --gold:#F5A623; --rose:#E11D48;
  --green:#1FA463; --green-l:#E6F6EE; --amber:#F59E0B; --amber-l:#FEF3C7;
  --ink:#10243B; --ink-2:#41586F; --ink-3:#7C8CA0; --line:#E4EAF1;
  --bg:#F4F6F9; --card:#fff; --shadow:0 1px 2px rgba(16,36,59,.05),0 6px 18px rgba(16,36,59,.06);
  --shadow-lg:0 10px 40px rgba(16,36,59,.16); --r:16px; --r-s:10px;
  --maxw:1180px; --bar-h:60px; --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);
  font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
a{color:var(--blue);text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input,select,textarea{font-family:inherit;font-size:15px}
h1,h2,h3,h4{margin:0;font-weight:800;letter-spacing:-.01em}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 16px;width:100%}
.muted{color:var(--ink-3)}.small{font-size:12.5px}
.rupiah{font-variant-numeric:tabular-nums}
.tag{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:700;background:var(--blue-l);color:var(--blue)}
.tag.green{background:var(--green-l);color:var(--green)} .tag.amber{background:var(--amber-l);color:#A5640A}
.tag.rose{background:#FDE8EC;color:var(--rose)} .tag.gray{background:#EEF2F7;color:var(--ink-3)}
.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.col{flex:1;min-width:0}.grow{flex:1}
.grid{display:grid;gap:12px}.hide{display:none!important}.center{text-align:center}
.spin{width:34px;height:34px;border:3px solid var(--blue-l);border-top-color:var(--blue);border-radius:50%;animation:sp 1s linear infinite;margin:40px auto}
@keyframes sp{to{transform:rotate(360deg)}}
.skel{background:linear-gradient(90deg,#eef2f7 25%,#f7fafc 37%,#eef2f7 63%);background-size:400% 100%;animation:sk 1.4s infinite}
@keyframes sk{0%{background-position:100% 0}100%{background-position:-100% 0}}

/* ============================ BUTTONS ============================ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 16px;border-radius:12px;font-weight:700;
  background:var(--navy);color:#fff;transition:.15s;font-size:14.5px;white-space:nowrap}
.btn:hover{filter:brightness(1.08);transform:translateY(-1px)}
.btn:active{transform:none}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn.blue{background:var(--blue)} .btn.green{background:var(--green)} .btn.amber{background:var(--amber)} .btn.rose{background:var(--rose)}
.btn.accent{background:var(--accent)} .btn.dark{background:var(--ink)}
.btn.ghost{background:#fff;color:var(--navy);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.ghost:hover{box-shadow:inset 0 0 0 1.5px var(--blue);color:var(--blue)}
.btn.sm{padding:8px 12px;font-size:13px;border-radius:10px}
.btn.xs{padding:5px 9px;font-size:12px;border-radius:8px}
.btn.block{width:100%}
.iconbtn{width:42px;height:42px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;background:#fff;box-shadow:inset 0 0 0 1.5px var(--line);color:var(--ink-2)}
.iconbtn:hover{color:var(--blue)}
.fab{position:fixed;right:16px;bottom:calc(74px + var(--safe-b));z-index:40;width:58px;height:58px;border-radius:50%;background:var(--navy);color:#fff;
  box-shadow:0 8px 24px rgba(0,61,122,.4);display:flex;align-items:center;justify-content:center}
.fab svg{width:26px;height:26px}

/* ============================ APP BAR ============================ */
.topbar{position:sticky;top:0;z-index:30;background:linear-gradient(120deg,var(--navy),var(--navy-2));color:#fff;box-shadow:0 2px 14px rgba(0,40,80,.2)}
.topbar .wrap{display:flex;align-items:center;gap:10px;height:var(--bar-h)}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:16px}
.brand .logo{width:38px;height:38px;border-radius:11px;background:#fff;color:var(--navy);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:20px;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.brand small{display:block;font-weight:600;opacity:.85;font-size:10.5px;letter-spacing:.02em}
.topbar .spacer{flex:1}
.chip-points{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.16);padding:7px 12px;border-radius:999px;font-weight:800;font-size:13px}
.chip-points svg{width:16px;height:16px;color:var(--gold)}

/* ============================ LAYOUT ============================ */
.shell{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - var(--bar-h))}
.sidebar{background:#fff;border-right:1px solid var(--line);padding:14px 12px;position:sticky;top:var(--bar-h);height:calc(100vh - var(--bar-h));overflow:auto}
.nav-item{display:flex;align-items:center;gap:12px;padding:11px 13px;border-radius:12px;color:var(--ink-2);font-weight:700;font-size:14px;margin-bottom:3px;cursor:pointer}
.nav-item:hover{background:var(--blue-ll)}
.nav-item.active{background:var(--navy);color:#fff}
.nav-item svg{width:20px;height:20px;flex:none}
.nav-sec{font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);padding:14px 13px 6px}
.main{padding:18px 16px 100px;min-width:0}
.content{max-width:var(--maxw);margin:0 auto}

/* mobile bottom nav */
.bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:35;background:#fff;border-top:1px solid var(--line);
  display:none;padding:6px 6px calc(6px + var(--safe-b));justify-content:space-around}
.bn-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;color:var(--ink-3);font-size:10.5px;font-weight:700;border-radius:10px}
.bn-item.active{color:var(--navy)} .bn-item svg{width:22px;height:22px}
.bn-badge{position:absolute;background:var(--rose);color:#fff;font-size:10px;font-weight:800;min-width:17px;height:17px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 4px}

/* ============================ CARDS / GRID ============================ */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:16px}
.section-title{display:flex;align-items:center;justify-content:space-between;margin:18px 0 12px}
.section-title h2{font-size:18px} .section-title a{font-size:13px;font-weight:700}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.stat{background:#fff;border-radius:var(--r);box-shadow:var(--shadow);padding:15px}
.stat .lbl{font-size:12px;color:var(--ink-3);font-weight:700;display:flex;align-items:center;gap:6px}
.stat .lbl .ic{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;background:var(--blue-l);color:var(--blue)}
.stat .val{font-size:22px;font-weight:800;margin-top:9px;letter-spacing:-.02em}
.stat .sub{font-size:11.5px;color:var(--green);font-weight:700;margin-top:2px}

/* promo / product grid (BCA style) */
.cats{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat-pill{flex:none;display:flex;align-items:center;gap:7px;padding:9px 15px;border-radius:999px;background:#fff;box-shadow:inset 0 0 0 1.5px var(--line);font-weight:700;font-size:13px;color:var(--ink-2);cursor:pointer}
.cat-pill.active{background:var(--navy);color:#fff;border-color:var(--navy)}
.prod-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:13px}
.prod{background:#fff;border-radius:14px;overflow:hidden;box-shadow:var(--shadow);cursor:pointer;transition:.15s;display:flex;flex-direction:column}
.prod:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
.prod .ph{aspect-ratio:5/4;background:var(--blue-ll);position:relative;overflow:hidden}
.prod .ph .emoji{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:40px}
.prod .ph img{width:100%;height:100%;object-fit:cover}
.prod .disc-badge{position:absolute;left:7px;top:7px;background:var(--rose);color:#fff;font-size:10px;font-weight:800;padding:2px 7px;border-radius:6px;z-index:2}
.prod .info{padding:7px 9px 9px;flex:1;display:flex;flex-direction:column}
.prod .nm{font-weight:800;font-size:12.5px;line-height:1.22;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:30px}
.prod .unit{font-size:10.5px;color:var(--ink-3);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prod .pr{font-weight:800;color:var(--navy);margin-top:auto;padding-top:4px;font-size:14px}
.prod .old{font-size:11px;color:var(--ink-3);text-decoration:line-through;font-weight:600}
.prod .add-fab{position:absolute;right:7px;bottom:7px;width:30px;height:30px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 7px rgba(0,0,0,.28);z-index:2}
.prod .add-fab svg{width:18px;height:18px}
.prod .add-fab:disabled{background:var(--ink-3);opacity:.6}
.prod .add-fab.guest{background:#fff;color:var(--navy)}

/* ============================ POS ============================ */
.pos-grid{display:grid;grid-template-columns:1fr 380px;gap:14px;align-items:start}
.pos-search{display:flex;gap:8px;margin-bottom:10px}
.search-box{flex:1;display:flex;align-items:center;gap:9px;background:#fff;border-radius:12px;box-shadow:inset 0 0 0 1.5px var(--line);padding:0 13px;height:46px}
.search-box input{border:none;outline:none;background:none;flex:1;font-size:14.5px}
.search-box svg{width:19px;height:19px;color:var(--ink-3)}
.pos-prods{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-height:calc(100vh - 250px);overflow:auto;padding-right:4px}
.pos-prods .prod .ph .emoji{font-size:34px} .pos-prods .prod .nm{min-height:0;font-size:12.5px}
.pos-prods .prod .info{padding:8px 9px 9px}
.cart-panel{background:#fff;border-radius:var(--r);box-shadow:var(--shadow);position:sticky;top:78px;display:flex;flex-direction:column;max-height:calc(100vh - 100px)}
.cart-head{padding:14px 16px;border-bottom:1px solid var(--line)}
.cart-items{flex:1;overflow:auto;padding:6px 16px;min-height:120px}
.ci{display:flex;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line)}
.ci .ic{width:42px;height:42px;border-radius:10px;background:var(--blue-ll);display:flex;align-items:center;justify-content:center;font-size:22px;flex:none}
.ci .nm{font-weight:700;font-size:13px;line-height:1.2}
.ci .pr{font-size:12px;color:var(--ink-3);margin-top:2px}
.qty{display:inline-flex;align-items:center;background:var(--bg);border-radius:8px;margin-top:5px}
.qty button{width:26px;height:26px;font-weight:900;font-size:16px;color:var(--navy)}
.qty span{min-width:28px;text-align:center;font-weight:800;font-size:13px}
.cart-foot{padding:14px 16px;border-top:1px solid var(--line)}
.sum-line{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px;color:var(--ink-2)}
.sum-line.tot{font-size:18px;font-weight:800;color:var(--ink);margin:8px 0 12px}

/* ============================ TABLE ============================ */
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);padding:10px 12px;border-bottom:1.5px solid var(--line)}
.tbl td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:hover td{background:var(--blue-ll)}
.tbl .em{text-align:center;padding:30px;color:var(--ink-3)}
.tablewrap{background:#fff;border-radius:var(--r);box-shadow:var(--shadow);overflow:auto}

/* ============================ FORM ============================ */
.field{margin-bottom:13px}
.field label{display:block;font-size:12.5px;font-weight:700;margin-bottom:5px;color:var(--ink-2)}
.field input,.field select,.field textarea{width:100%;padding:11px 13px;border-radius:11px;border:1.5px solid var(--line);outline:none;background:#fff;transition:.15s}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-l)}
.field .hint{font-size:11.5px;color:var(--ink-3);margin-top:4px}
.field.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* ============================ MODAL ============================ */
.overlay{position:fixed;inset:0;background:rgba(8,20,35,.55);z-index:60;display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(2px)}
.sheet{background:#fff;width:100%;max-width:560px;border-radius:22px 22px 0 0;max-height:92vh;overflow:auto;animation:up .25s ease}
.sheet.lg{max-width:760px}
@keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
.sheet-head{position:sticky;top:0;background:#fff;padding:16px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;z-index:2;border-radius:22px 22px 0 0}
.sheet-head h3{font-size:17px}
.sheet-body{padding:18px}
.grip{width:42px;height:5px;background:var(--line);border-radius:99px;margin:8px auto 0}
.modal-c{position:fixed;inset:0;background:rgba(8,20,35,.55);z-index:60;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:#fff;border-radius:18px;max-width:440px;width:100%;max-height:92vh;overflow:auto;animation:up .2s ease}

/* ============================ AUTH ============================ */
.auth-bg{min-height:100vh;background:linear-gradient(135deg,var(--navy),var(--navy-2) 55%,var(--blue));display:flex;align-items:center;justify-content:center;padding:18px}
.auth-card{background:#fff;border-radius:24px;max-width:430px;width:100%;overflow:hidden;box-shadow:0 24px 70px rgba(0,20,50,.4)}
.auth-hero{background:linear-gradient(120deg,var(--navy),var(--blue));color:#fff;padding:26px 24px;text-align:center}
.auth-hero .logo{width:60px;height:60px;border-radius:18px;background:#fff;color:var(--navy);font-weight:900;font-size:30px;display:flex;align-items:center;justify-content:center;margin:0 auto 12px}
.auth-hero h1{font-size:21px} .auth-hero p{opacity:.9;font-size:13px;margin-top:4px}
.auth-body{padding:22px 24px 26px}
.tabs{display:flex;background:var(--bg);border-radius:12px;padding:4px;margin-bottom:18px}
.tabs button{flex:1;padding:9px;border-radius:9px;font-weight:700;color:var(--ink-3);font-size:14px}
.tabs button.active{background:#fff;color:var(--navy);box-shadow:var(--shadow)}

/* ============================ MEMBER CARD ============================ */
.membercard{background:linear-gradient(135deg,var(--navy),var(--blue));color:#fff;border-radius:20px;padding:18px;position:relative;overflow:hidden;box-shadow:var(--shadow-lg)}
.membercard::before{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.08)}
.membercard::after{content:"";position:absolute;right:30px;bottom:-60px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.06)}
.membercard .lvl{position:absolute;right:16px;top:14px;background:var(--gold);color:#5b3700;font-weight:800;font-size:11px;padding:4px 10px;border-radius:99px}
.membercard .mc-logo{display:flex;align-items:center;gap:8px;font-weight:800}
.membercard .mc-logo .l{width:30px;height:30px;border-radius:8px;background:#fff;color:var(--navy);display:flex;align-items:center;justify-content:center;font-weight:900}
.membercard .mc-name{font-size:20px;font-weight:800;margin-top:18px}
.membercard .mc-no{font-size:12px;opacity:.85;letter-spacing:.08em;margin-top:2px}
.membercard .mc-bar{background:#fff;border-radius:10px;padding:8px;margin-top:14px;text-align:center}
.membercard .mc-pts{display:flex;justify-content:space-between;margin-top:14px;font-size:12px}
.membercard .mc-pts b{display:block;font-size:17px;margin-top:2px}

/* ============================ TOAST ============================ */
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--ink);color:#fff;padding:11px 18px;border-radius:12px;font-size:13.5px;font-weight:600;box-shadow:var(--shadow-lg);animation:tin .3s;display:flex;align-items:center;gap:8px}
.toast.ok{background:var(--green)} .toast.err{background:var(--rose)}
@keyframes tin{from{opacity:0;transform:translateY(10px)}to{opacity:1}}
.bar{height:6px;background:var(--line);border-radius:99px;overflow:hidden}.bar>i{display:block;height:100%;background:var(--blue)}
hr.sep{border:none;border-top:1px solid var(--line);margin:14px 0}
.kbd{font-family:monospace;background:var(--bg);padding:2px 7px;border-radius:6px;font-size:12px}

/* ============================ HERO BANNER ============================ */
.hero-banner{background:linear-gradient(115deg,var(--navy),var(--blue));color:#fff;border-radius:20px;padding:22px 24px;position:relative;overflow:hidden;margin-bottom:16px}
.hero-banner h2{font-size:22px}.hero-banner p{opacity:.9;font-size:13px;margin-top:4px;max-width:70%}
.hero-banner .badge-pts{position:absolute;right:18px;bottom:14px;background:var(--gold);color:#5b3700;font-weight:800;padding:8px 14px;border-radius:14px;font-size:13px;display:flex;gap:6px;align-items:center}

/* ============================ SCANNER ============================ */
#scan-region{width:100%;border-radius:14px;overflow:hidden;background:#000;min-height:260px}
#scan-region video{border-radius:14px}

/* ============================ RECEIPT ============================ */
.receipt{font-family:'Courier New',monospace;width:300px;margin:0 auto;color:#000}
.receipt h4{font-size:15px;text-align:center;margin:0}.receipt .c{text-align:center;font-size:11px}
.receipt hr{border:none;border-top:1px dashed #000;margin:6px 0}.receipt .l{display:flex;justify-content:space-between;font-size:12px;margin:2px 0}
.receipt .b{font-weight:bold;font-size:13px}
@media print{body *{visibility:hidden}#print-area,#print-area *{visibility:visible}#print-area{position:absolute;left:0;top:0;width:100%}}

/* ============================ RESPONSIVE ============================ */
@media(max-width:1080px){.prod-grid{grid-template-columns:repeat(4,1fr)}.pos-prods{grid-template-columns:repeat(3,1fr)}}
@media(max-width:880px){
  .shell{grid-template-columns:1fr}.sidebar{display:none}.main{padding:14px 14px 96px}
  .bottomnav{display:flex}
  .prod-grid{grid-template-columns:repeat(3,1fr)}.pos-grid{grid-template-columns:1fr}
  .pos-prods{grid-template-columns:repeat(3,1fr);max-height:none}
  .cart-panel{position:static;max-height:none}.stat-grid{grid-template-columns:repeat(2,1fr)}
  .overlay{align-items:flex-end}
}
@media(max-width:520px){
  .prod-grid{grid-template-columns:repeat(2,1fr);gap:9px}.pos-prods{grid-template-columns:repeat(2,1fr);gap:9px}
  .prod .ph .emoji{font-size:30px}
  .prod .add-fab{width:26px;height:26px}.prod .add-fab svg{width:16px;height:16px}
  .prod .info{padding:6px 8px 8px}.prod .nm{font-size:11.5px;min-height:26px}.prod .pr{font-size:13px}
  .brand small{display:none}.topbar .brand-text{display:none}
  .field.row2{grid-template-columns:1fr}
}
.empty{text-align:center;padding:50px 20px;color:var(--ink-3)}
.empty svg{width:54px;height:54px;opacity:.4;margin-bottom:10px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}.dot.on{background:var(--green)}.dot.off{background:var(--ink-3)}
.pill-toggle{display:inline-flex;background:var(--bg);border-radius:10px;padding:3px}.pill-toggle button{padding:7px 12px;border-radius:8px;font-weight:700;font-size:12.5px;color:var(--ink-3)}.pill-toggle button.active{background:#fff;color:var(--navy);box-shadow:var(--shadow)}
</style>
</head>

  /* ---- orders ---- */
  async function createOrder(order, items, opts={}){
    if(!isDemo){
      // Semua operasi (order + item + kurangi stok + catat poin) dijalankan
      // di SERVER via RPC place_order (SECURITY DEFINER) -> aman & lewati RLS.
      const {data:o,error}=await sb.rpc('place_order',{ p_order: order, p_items: items, p_customer_id: order.customer_id||null });
      if(error) throw error;
      return o;
    }
    const d=load(); const id=uid(); d.seq.order=(d.seq.order||1000)+1;
    const o={...order,id,order_no:order.order_no||('INV'+d.seq.order),created_at:now(),updated_at:now()};
    d.orders[id]=o; items.forEach(it=>{ const iid=uid(); d.items[iid]={...it,id:iid,order_id:id,created_at:now()}; });
    if(o.customer_id){ const m=d.profiles[o.customer_id]; if(m){ m.points = (m.points||0) + (o.points_earned||0) - (o.points_used||0);
      if(o.points_earned>0) d.points[uid()]={id:uid(),member_id:m.id,order_id:id,type:'earn',points:o.points_earned,note:'Belanja '+o.order_no,created_at:now()};
      if(o.points_used>0) d.points[uid()]={id:uid(),member_id:m.id,order_id:id,type:'redeem',points:-o.points_used,note:'Tukar poin '+o.order_no,created_at:now()}; } }
    // kurangi stok
    items.forEach(it=>{ const pr=Object.values(d.products).find(p=>p.id===it.product_id); if(pr)pr.stock=Math.max(0,(pr.stock||0)-Number(it.qty)); });
    save(d); return o;
  }

  /* ---- stats ---- */
  async function stats(){
    if(!isDemo){
      const today=new Date(); const y=today.toISOString().slice(0,10);
      const [ordCnt, memCnt, ordData, prodCnt]=await Promise.all([
        sb.from('orders').select('*',{count:'exact',head:true}).in('status',['paid','completed']),
        sb.from('profiles').select('*',{count:'exact',head:true}).eq('role','member'),
        sb.from('orders').select('total,channel,status,created_at').in('status',['paid','completed']),
        sb.from('products').select('*',{count:'exact',head:true})
      ]);
      const sales=ordData.data||[];
      const revenue=sales.reduce((a,b)=>a+Number(b.total||0),0);
      const todayRev=sales.filter(o=>o.created_at&&o.created_at.startsWith(y)).reduce((a,b)=>a+Number(b.total||0),0);
      const online=sales.filter(o=>o.channel==='online').length, offline=sales.filter(o=>o.channel==='offline').length;
      return {revenue,orders:ordCnt.count||sales.length,members:memCnt.count||0,todayRev,online,offline,products:prodCnt.count||0,sales};
    }
    const d=ensureSeed(); const sales=Object.values(d.orders).filter(o=>['paid','completed'].includes(o.status));
    const today=new Date().toISOString().slice(0,10);
    return { revenue:sales.reduce((a,b)=>a+Number(b.total||0),0), orders:sales.length,
      members:Object.values(d.profiles).filter(x=>x.role==='member').length,
      todayRev:sales.filter(o=>o.created_at.startsWith(today)).reduce((a,b)=>a+Number(b.total||0),0),
      online:sales.filter(o=>o.channel==='online').length, offline:sales.filter(o=>o.channel==='offline').length,
      products:Object.keys(d.products).length, sales };
  }

  /* ===================== ROUTER ===================== */
  route(){
    const h=(location.hash||'').replace('#','')||'store';
    this.state.view=h;
    const el=document.querySelector('.sidebar')||document.querySelector('.bottomnav');
    document.querySelectorAll('.nav-item,.bn-item').forEach(x=>x.classList.toggle('active',x.dataset.v===h));
    if(window.scrollTo) window.scrollTo(0,0);
    const v=document.getElementById('view'); if(!v)return;
    // TAMU (belum login): hanya katalog publik
    if(!this.state.user){ this.viewStore(); return; }
    if(this.isAdmin()){
      if(['store','cart','product'].includes(h)) { return this.viewStore(true); } // admin lihat toko
      ({dashboard:()=>this.viewDashboard(),pos:()=>this.viewPOS(),products:()=>this.viewProducts(),
        'online-orders':()=>this.viewOnlineOrders(),members:()=>this.viewMembers(),
        staff:()=>{ this.state._memMode='all'; this.viewMembers(); },
        reports:()=>this.viewReports(),
        settings:()=>this.viewSettings(),storeview:()=>this.viewStore(true)
      }[h]||this.viewDashboard)();
    } else {
      ({store:()=>this.viewStore(),cart:()=>this.viewCart(),orders:()=>this.viewMemberOrders(),
        card:()=>this.viewMemberCard(),points:()=>this.viewMemberPoints(),referral:()=>this.viewReferral(),
        profile:()=>this.viewMemberProfile()
      }[h]||this.viewStore)();
    }
  },

  async viewStore(forStaff=false){

        ${guest?`<button class="btn" style="margin-top:12px" onclick="App.openLogin()">🛒 Masuk untuk Belanja</button>`:`<div class="badge-pts">${IC.coin} ${m.points||0} poin</div>`}

    this.bindSearch(); this.bindCats(); this.renderProdGrid(prods);

  bindSearch(){ const i=document.getElementById('psearch');
    let t; i.oninput=()=>{clearTimeout(t);t=setTimeout(()=>{
      this.state.search=i.value;
      let r=this.state._prods;
      if(this.state.category!=='all')r=r.filter(x=>x.category_id===this.state.category);
      const s=i.value.toLowerCase();
      if(s)r=r.filter(x=>(x.name+' '+(x.barcode||'')+' '+(x.brand||'')).toLowerCase().includes(s));
      this.renderProdGrid(r);
    },200);};
  },
  bindCats(){ document.querySelectorAll('#catbar .cat-pill').forEach(p=>p.onclick=()=>{
    this.state.category=p.dataset.c; document.querySelectorAll('#catbar .cat-pill').forEach(x=>x.classList.toggle('active',x===p));
    this.viewStore(this.isAdmin());
  });},
  renderProdGrid(prods){
    const g=document.getElementById('pgrid');
    if(!prods.length){ g.innerHTML=`<div class="empty" style="grid-column:1/-1">${IC.search}<p>Produk tidak ditemukan</p></div>`; return; }
    const guest=!this.state.user;
    g.innerHTML=prods.map(p=>{
      const disc=p.cost&&p.price<p.cost; const em=p.emoji||'📦'; const out=Number(p.stock||0)<=0;
      const act=guest?`App.openLogin('Masuk dulu untuk belanja & dapat poin')`:`App.quickAdd('${p.id}')`;
      return `<div class="prod" onclick="App.openProduct('${p.id}')">
        <div class="ph">${p.image_url?`<img src="${p.image_url}">`:`<div class="emoji">${em}</div>`}
          ${disc?`<span class="disc-badge">HEMAT</span>`:''}
          ${out?`<span class="disc-badge" style="background:var(--ink-3)">HABIS</span>`:''}
          <button class="add-fab ${guest?'guest':''}" ${out?'disabled':''} onclick="event.stopPropagation();${act}" aria-label="Tambah">${out?'✕':IC.plus}</button>
        </div>
        <div class="info">
          <div class="nm">${p.name}</div>
          <div class="unit">${p.brand||p.unit||''}</div>
          <div class="pr">${this.money(p.price)}</div>
        </div></div>`;
    }).join('');
  },
  quickAdd(id){ if(!this.state.user){ this.openLogin('Masuk dulu untuk belanja & dapat poin.'); return; } const p=this.state._prods.find(x=>x.id===id); if(!p)return;
    const ex=this.state.cart.find(x=>x.product_id===id);
    if(ex){ if(ex.qty>=p.stock){this.toast('Stok tidak cukup','err');return;} ex.qty++; }
    else this.state.cart.push({product_id:p.id,name:p.name,price:p.price,qty:1,emoji:p.emoji||'📦',stock:p.stock,barcode:p.barcode});
    this.updateCartBadge(); this.toast(`${p.name} ditambah ✓`,'ok');
  },
  updateCartBadge(){ const c=this.state.cart.reduce((a,b)=>a+b.qty,0); const el=document.getElementById('cart-count');
    if(el){ if(c>0){el.classList.remove('hide');el.textContent=c;}else el.classList.add('hide');} },
  async openProduct(id){

  /* ---- CART / CHECKOUT ---- */
  viewCart(){
    const v=document.getElementById('view'); const c=this.state.cart;
    if(!c.length){ v.innerHTML=`<div class="empty">${IC.cart}<h3>Keranjang kosong</h3><p class="muted">Yuk belanja dulu di toko kami</p><button class="btn" style="margin-top:14px" onclick="location.hash='store'">Mulai Belanja</button></div>`; return; }
    const sub=c.reduce((a,b)=>a+b.price*b.qty,0);
    const pts=Math.floor(sub/CONFIG.EARN_PER_RP);
    v.innerHTML=`
      <div class="section-title"><h2>Keranjang Belanja</h2></div>
      <div style="display:grid;grid-template-columns:1fr 340px;gap:16px;align-items:start" id="cart-layout">
        <div class="card" id="ci-list">${c.map((it,i)=>`
          <div class="ci">
            <div class="ic">${it.emoji||'📦'}</div>
            <div class="col"><div class="nm">${it.name}</div><div class="pr">${this.money(it.price)}</div>
              <div class="qty"><button onclick="App.cartQty(${i},-1)">${IC.minus}</button><span>${it.qty}</span><button onclick="App.cartQty(${i},1)">${IC.plus}</button></div>
            </div>
            <div class="center"><b style="color:var(--navy)">${this.money(it.price*it.qty)}</b><button class="iconbtn" style="width:32px;height:32px;margin-top:6px" onclick="App.cartRemove(${i})">${IC.trash}</button></div>
          </div>`).join('')}
        </div>
        <div class="card" id="checkout-box" style="position:sticky;top:78px">
          <h3>Ringkasan</h3>
          <div class="sum-line"><span>Subtotal</span><span>${this.money(sub)}</span></div>

          <div class="field" style="margin:10px 0">
            <label>Gunakan poin (1 poin = ${this.money(CONFIG.REDEEM_VALUE)})</label>
            <div class="row"><input type="number" id="use-pts" min="0" max="${this.state.user.points||0}" value="0" oninput="App.calcCart()"><span class="tag" style="margin-left:6px">saldo ${this.state.user.points||0}</span></div>
          </div>
          <div class="sum-line"><span>Potongan poin</span><span id="pts-disc">- ${this.money(0)}</span></div>
          <div class="sum-line tot"><span>Total</span><span id="grand-tot">${this.money(sub)}</span></div>
          <div class="field"><label>Alamat pengiriman</label><textarea id="addr" rows="2" placeholder="Alamat lengkap untuk antar">${this.state.user.address||''}</textarea></div>
          <div class="field"><label>Catatan (opsional)</label><input id="note" placeholder="Catatan untuk penjual"></div>
          <button class="btn green block" onclick="App.placeOrder()">${IC.check} Buat Pesanan</button>
          <p class="muted small center" style="margin-top:8px">+ ${pts} poin akan didapat dari pesanan ini</p>
        </div>
      </div>`;
    this.calcCart();
    if(window.innerWidth<=880){ document.getElementById('cart-layout').style.gridTemplateColumns='1fr'; document.getElementById('checkout-box').style.position='static'; }
  },
  cartQty(i,d){ const it=this.state.cart[i]; const nv=it.qty+d; if(nv<=0){this.cartRemove(i);return;} if(nv>it.stock){this.toast('Stok tidak cukup','err');return;} it.qty=nv; this.viewCart(); this.updateCartBadge(); },
  cartRemove(i){ this.state.cart.splice(i,1); this.viewCart(); this.updateCartBadge(); },
  calcCart(){ const sub=this.state.cart.reduce((a,b)=>a+b.price*b.qty,0);
    const use=Math.min(Number(document.getElementById('use-pts').value||0),this.state.user.points||0,Math.floor(sub/CONFIG.REDEEM_VALUE));
    const disc=use*CONFIG.REDEEM_VALUE; const tot=sub-disc;
    const pd=document.getElementById('pts-disc'),gt=document.getElementById('grand-tot');
    if(pd)pd.textContent='- '+this.money(disc); if(gt)gt.textContent=this.money(tot);
  },
  async placeOrder(){
    if(!this.state.cart.length)return;
    const sub=this.state.cart.reduce((a,b)=>a+b.price*b.qty,0);
    const use=Math.min(Number(document.getElementById('use-pts').value||0),this.state.user.points||0);
    const disc=use*CONFIG.REDEEM_VALUE; const tot=sub-disc;
    const addr=document.getElementById('addr').value.trim(); if(!addr){this.toast('Alamat pengiriman wajib diisi','err');return;}
    const ptsEarn=Math.floor(tot/CONFIG.EARN_PER_RP);
    const order={ order_no:'ONL'+Date.now().toString().slice(-8), customer_id:this.state.user.id, customer_name:this.state.user.full_name,
      channel:'online', status:'pending', subtotal:sub, discount:disc, points_used:use, points_earned:ptsEarn, shipping:0,
      total:tot, address:addr, note:document.getElementById('note').value, payment_method:'COD' };
    const items=this.state.cart.map(it=>({product_id:it.product_id,name:it.name,price:it.price,qty:it.qty,subtotal:it.price*it.qty}));
    try{
      const o=await DB.createOrder(order,items);
      this.state.user.points=(this.state.user.points||0)+ptsEarn-use;
      this.state.cart=[]; this.updateCartBadge();
      this.openSheet(`<div class="sheet-body center"><div style="font-size:54px">🎉</div><h2>Pesanan Dibuat!</h2>
        <p class="muted">No. pesanan <b class="kbd">${o.order_no}</b></p>
        <p class="muted small">Pesanan online Anda akan diproses kasir. Pantau di menu Pesanan.</p>
        <div class="row" style="justify-content:center;margin-top:16px"><button class="btn ghost" onclick="App.closeSheet();location.hash='store'">Lanjut Belanja</button>
        <button class="btn" onclick="App.closeSheet();location.hash='orders'">Lihat Pesanan</button></div></div>`);
    }catch(e){ this.toast('Gagal: '+e.message,'err'); }
  },

  async posSearch(q){
    let r=this.state._prods; if(!r){ r=await DB.listProducts(); this.state._prods=r; }
    const s=(q||'').toLowerCase();
    let list=r.filter(x=>x.is_active&&(x.name+' '+(x.barcode||'')+' '+(x.brand||'')).toLowerCase().includes(s));
    if(q)list=list.slice(0,24); else list=list.slice(0,24);
    document.getElementById('pos-prods').innerHTML=list.map(p=>`<div class="prod" onclick="App.posAdd('${p.id}')">
      <div class="ph"><div class="emoji">${p.emoji||'📦'}</div></div><div class="info"><div class="nm">${p.name}</div>
      <div class="pr">${this.money(p.price)}</div><div class="muted small">stok ${p.stock}</div></div></div>`).join('')||`<div class="empty">Ketik untuk mencari</div>`;

  async posBarcode(code){
    code=code.trim(); if(!code)return;
    let p=await DB.getProductByBarcode(code);
    if(!p){ p=this.state._prods?.find(x=>x.barcode===code); }
    if(!p){ this.toast('Barcode '+code+' tidak ditemukan','err'); return; }
    this.posAdd(p.id,true);
  },
  posAdd(id,silent){
    const p=this.state._prods.find(x=>x.id===id); if(!p)return;
    const c=this.state.posCart; const ex=c.find(x=>x.product_id===id);
    if(ex){ if(ex.qty>=p.stock){this.toast('Stok habis','err');return;} ex.qty++; }
    else c.push({product_id:p.id,name:p.name,price:p.price,qty:1,emoji:p.emoji||'📦',stock:p.stock,barcode:p.barcode});
    if(!silent)this.toast(p.name+' ✓');
    this.posRender();
  },
  posRender(){
    const c=this.state.posCart; const box=document.getElementById('pos-items');
    if(!c.length){ box.innerHTML=`<div class="empty small">${IC.cart}<p>Keranjang kosong</p></div>`; }
    else box.innerHTML=c.map((it,i)=>`<div class="ci"><div class="ic">${it.emoji}</div>
      <div class="col"><div class="nm">${it.name}</div><div class="pr">${this.money(it.price)}</div>
      <div class="qty"><button onclick="App.posQty(${i},-1)">${IC.minus}</button><span>${it.qty}</span><button onclick="App.posQty(${i},1)">${IC.plus}</button></div></div>
      <div class="center"><b style="color:var(--navy)">${this.money(it.price*it.qty)}</b></div></div>`).join('');

  posQty(i,d){ const it=this.state.posCart[i]; const nv=it.qty+d; if(nv<=0){this.state.posCart.splice(i,1);} else if(nv>it.stock){this.toast('Stok tidak cukup','err');return;} else it.qty=nv; this.posRender(); },
  posClear(){ this.state.posCart=[]; this.state.posCustomer=null; this.posRender(); this.renderCustInfo(); },
  posTotals(){
    const sub=this.state.posCart.reduce((a,b)=>a+b.price*b.qty,0);
    const cust=this.state.posCustomer; const pts=cust?Math.min(Number(document.getElementById('pos-pts')?.value||0),cust.points,Math.floor(sub/CONFIG.REDEEM_VALUE)):0;
    const disc=pts*CONFIG.REDEEM_VALUE; const tot=sub-disc;
    document.getElementById('pos-sub').textContent=this.money(sub);
    document.getElementById('pos-disc').textContent='- '+this.money(disc);
    document.getElementById('pos-total').textContent=this.money(tot);
    const paid=Number(document.getElementById('pos-paid').value||0);
    document.getElementById('pos-change').textContent=this.money(Math.max(0,paid-tot));
    this.state._posTot={sub,disc,pts,tot};
  },
  renderCustInfo(){ const c=this.state.posCustomer; const el=document.getElementById('cust-info');

  async posCheckout(){
    const c=this.state.posCart; if(!c.length){this.toast('Keranjang kosong','err');return;}
    const t=this.state._posTot; const paid=Number(document.getElementById('pos-paid').value||0);
    if(paid<t.tot){this.toast('Uang bayar kurang','err');return;}
    const cust=this.state.posCustomer;
    const ptsEarn=Math.floor(t.tot/CONFIG.EARN_PER_RP);
    const order={ order_no:'POS'+Date.now().toString().slice(-8), customer_id:cust?cust.id:null, customer_name:cust?cust.full_name:'Tamu (Walk-in)',
      channel:'offline', status:'paid', subtotal:t.sub, discount:t.disc, points_used:t.pts, points_earned:cust?ptsEarn:0, shipping:0,
      total:t.tot, paid_amount:paid, change_amount:paid-t.tot, payment_method:document.getElementById('pos-pay').value,
      cashier_id:this.state.user.id };
    const items=c.map(it=>({product_id:it.product_id,name:it.name,price:it.price,qty:it.qty,subtotal:it.price*it.qty}));
    try{
      const o=await DB.createOrder(order,items);
      this.state.posCart=[]; this.state.posCustomer=null; this.posRender(); this.renderCustInfo(); this.updateOnlineBadge();
      this.printReceipt(o,items); this.toast('Transaksi sukses ✓ '+o.order_no,'ok');
    }catch(e){ this.toast('Gagal: '+e.message,'err'); }
  },

  /* ---- BARCODE SCANNER ---- */
  openScanner(){
    this.openSheet(`<div class="sheet-head"><h3>📷 Scan Barcode Produk</h3><button class="iconbtn" onclick="App.stopScan();App.closeSheet()">${IC.x}</button></div>
      <div class="sheet-body"><div id="scan-region"></div>
      <p class="muted small center" style="margin-top:8px">Arahkan kamera ke barcode produk (EAN/UPC/Code128). Hasil scan otomatis masuk keranjang.</p>
      <div class="row" style="margin-top:10px;gap:8px"><button class="btn ghost block" onclick="App.stopScan()">Jeda</button><button class="btn block" onclick="App.startScan()">Mulai Kamera</button></div></div>`,true);
    this.startScan();
  },
  startScan(){
    if(!window.Html5Qrcode){ this.toast('Library scanner belum termuat','err'); return; }
    this.stopScan();
    const id='scan-region';
    this.state.scanner=new Html5Qrcode(id,{verbose:false});
    const cfg={fps:10,qrbox:{width:260,height:140},formatsToSupport:[
      Html5QrcodeSupportedFormats.EAN_13,Html5QrcodeSupportedFormats.EAN_8,
      Html5QrcodeSupportedFormats.UPC_A,Html5QrcodeSupportedFormats.UPC_E,
      Html5QrcodeSupportedFormats.CODE_128,Html5QrcodeSupportedFormats.CODE_39]};
    this.state.scanner.start({facingMode:'environment'},cfg,(code)=>this.onScan(code))
      .catch(e=>{ this.toast('Tidak bisa akses kamera: '+e,'err'); });
  },
  onScan(code){
    if(this.state._lastScan && Date.now()-this.state._lastScan<1500)return;
    this.state._lastScan=Date.now();
    this.posBarcode(code);
    this.toast('Scanned: '+code,'ok');
  },
  stopScan(){ if(this.state.scanner){ try{ this.state.scanner.stop().then(()=>this.state.scanner.clear()); }catch(e){} this.state.scanner=null; } },

  /* ---- IMPORT / EXPORT ---- */
  importModal(){ this.openSheet(`<div class="sheet-head"><h3>Upload Massal Produk (CSV)</h3><button class="iconbtn" onclick="App.closeSheet()">${IC.x}</button></div>
      <div class="sheet-body">
        <div class="card" style="background:var(--blue-ll);font-size:12.5px"><b>Format kolom CSV:</b><br><code class="kbd">name,barcode,brand,price,cost,stock,unit,emoji,category_id</code><br>Baris pertama = header (diabaikan). Kosongkan category_id bila tak tahu.</div>
        <div class="field" style="margin-top:12px"><label>Pilih file .csv</label><input type="file" id="csv-file" accept=".csv"></div>
        <button class="btn green block" onclick="App.doImport()">${IC.upload} Proses Upload</button>
        <hr class="sep"><div class="center"><button class="btn ghost sm" onclick="App.downloadTemplate()">⬇ Unduh Template CSV</button></div>
        <p class="muted small center" style="margin-top:8px">Contoh baris: Indomie Goreng,8998866200010,Indomie,3500,2800,200,pcs,🍜,cat-6</p>
      </div>`); },
  downloadTemplate(){ const csv='name,barcode,brand,price,cost,stock,unit,emoji,category_id\nIndomie Goreng,8998866200010,Indomie,3500,2800,200,pcs,🍜,cat-6\nAqua 600ml,8992753111014,Aqua,4000,3000,120,btl,💧,cat-2\n'; this.download('template_produk_toko_hana.csv',csv); },
  async doImport(){ const f=document.getElementById('csv-file').files[0]; if(!f){this.toast('Pilih file dulu','err');return;}
    const txt=await f.text(); const rows=this.parseCSV(txt); if(rows.length<2){this.toast('CSV kosong/tidak valid','err');return;}
    const header=rows[0].map(h=>h.trim().toLowerCase()); const idx={}; ['name','barcode','brand','price','cost','stock','unit','emoji','category_id'].forEach(k=>idx[k]=header.indexOf(k));
    const cats=this.state._cats||(this.state._cats=await DB.listCategories());
    const objs=[]; rows.slice(1).forEach(r=>{ if(!r.length)return; const get=c=>idx[c]>=0?(r[idx[c]]||'').trim():'';
      const name=get('name'); if(!name)return;
      let catId=get('category_id'); if(!catId||!cats.find(c=>c.id===catId)) catId=cats[0]?.id;
      objs.push({ name, barcode:get('barcode'), sku:get('barcode'), brand:get('brand'), price:Number(get('price')||0), cost:Number(get('cost')||0),
        stock:Number(get('stock')||0), unit:get('unit')||'pcs', emoji:get('emoji')||'📦', category_id:catId, is_active:true, image_url:'' }); });
    try{ const n=await DB.bulkUpsertProducts(objs); this.closeSheet(); this.toast(n+' produk diupload ✓','ok'); this.viewProducts(); }catch(e){this.toast('Gagal: '+e.message,'err');} },
  parseCSV(txt){ const rows=[]; let row=[],cur='',q=false;
    for(let i=0;i<txt.length;i++){ const ch=txt[i];
      if(q){ if(ch==='"'){ if(txt[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=ch; }
      else { if(ch==='"')q=true; else if(ch===','){row.push(cur);cur='';} else if(ch==='\n'){row.push(cur);rows.push(row);row=[];cur='';} else if(ch!=='\r')cur+=ch; } }
    if(cur||row.length){row.push(cur);rows.push(row);} return rows.filter(r=>r.some(c=>c.trim()!=='')); },
  async exportProducts(){ const prods=this.state._prods||await DB.listProducts(); const cats=this.state._cats||(this.state._cats=await DB.listCategories());
    let csv='name,barcode,brand,price,cost,stock,unit,emoji,category_id,status\n';
    prods.forEach(p=>{ csv+=[p.name,p.barcode||'',p.brand||'',p.price,p.cost,p.stock,p.unit,p.emoji||'',cats.find(c=>c.id===p.category_id)?.id||'',p.is_active?'aktif':'nonaktif'].map(x=>`"${String(x).replace(/"/g,'""')}"`).join(',')+'\n'; });
    this.download('produk_toko_hana.csv',csv); this.toast(prods.length+' produk diekspor ✓','ok'); },
  download(name,content){ const b=new Blob([content],{type:'text/csv;charset=utf-8'}); const u=URL.createObjectURL(b); const a=document.createElement('a'); a.href=u; a.download=name; a.click(); URL.revokeObjectURL(u); },

        <div class="card"><h3>Transaksi Terbaru</h3><div class="tablewrap" style="box-shadow:none">${orders.slice(0,8).map(o=>`<div class="sum-line"><span class="kbd small">${o.order_no}</span><span>${this.money(o.total)}</span></div>`).join('')||'<div class="empty small">Kosong</div>'}</div></div>
        <div class="card"><h3>Pelanggan Teratas</h3>${topArr.length?topArr.map(([n,c],i)=>`<div class="sum-line"><span><b>${i+1}.</b> ${n}</span><span class="tag">${c}×</span></div>`).join(''):'<div class="empty small">Belum ada data</div>'}</div>
      </div>`;
  },
  async exportOrders(){ const o=await DB.listOrders({}); let csv='order_no,tanggal,pelanggan,channel,status,subtotal,diskon,total,bayar\n';
    o.forEach(x=>{ csv+=[x.order_no,new Date(x.created_at).toISOString(),x.customer_name,x.channel,x.status,x.subtotal,x.discount,x.total,x.paid_amount].map(v=>`"${v||''}"`).join(',')+'\n'; });
    this.download('transaksi_toko_hana.csv',csv); this.toast('Transaksi diekspor ✓','ok'); },

  /* ---- SETTINGS ---- */
  async viewSettings(){
    const v=document.getElementById('view'); const s=await DB.getSettings(); const st=s.store||{};
    v.innerHTML=`<div class="section-title"><h2>Pengaturan Toko</h2></div>
      <div class="card"><form id="set-form">
        <h3>Profil Toko</h3>
        <div class="field row2"><div><label>Nama Toko</label><input name="name" value="${st.name||''}"></div><div><label>Telepon</label><input name="phone" value="${st.phone||''}"></div></div>
        <div class="field"><label>Tagline</label><input name="tagline" value="${st.tagline||''}"></div>
        <div class="field"><label>Alamat</label><textarea name="address" rows="2">${st.address||''}</textarea></div>
        <hr class="sep"><h3>Sistem Poin & Referral</h3>
        <div class="field row2"><div><label>Poin per Rp belanja</label><input name="earn_per_rp" type="number" value="${CONFIG.EARN_PER_RP}"></div><div><label>Nilai 1 poin (Rp)</label><input name="redeem_value" type="number" value="${CONFIG.REDEEM_VALUE}"></div></div>
        <div class="field row2"><div><label>Bonus Referral</label><input name="referral_bonus" type="number" value="${CONFIG.REFERRAL_BONUS}"></div><div><label>Bonus Daftar</label><input name="signup_bonus" type="number" value="${CONFIG.SIGNUP_BONUS}"></div></div>
        <button class="btn green" type="submit">${IC.check} Simpan</button>
      </form>
      <hr class="sep">
      <div class="card" style="background:var(--blue-ll)">
        <b>📊 Status Koneksi</b>
        <div class="row" style="margin-top:6px"><span class="dot ${DB.demo()?'off':'on'}"></span> ${DB.demo()?'Mode Demo (data di browser ini saja)':'Terhubung Supabase'}</div>
        <p class="muted small" style="margin-top:6px">${DB.demo()?'Untuk produksi: isi <code class="kbd">CONFIG.SUPABASE_URL</code> & <code class="kbd">CONFIG.SUPABASE_KEY</code> di index.html lalu jalankan <code class="kbd">schema.sql</code> di Supabase SQL Editor.':''}</p>
      </div></div>`;
    document.getElementById('set-form').onsubmit=async e=>{ e.preventDefault(); const f=new FormData(e.target);
      await DB.saveSettings('store',{name:f.get('name'),tagline:f.get('tagline'),phone:f.get('phone'),address:f.get('address')});
      CONFIG.EARN_PER_RP=Number(f.get('earn_per_rp')); CONFIG.REDEEM_VALUE=Number(f.get('redeem_value'));
      this.toast('Pengaturan disimpan ✓','ok'); };
  },

  /* ===================== MODAL / SHEET ===================== */
  openSheet(html,simple){
    let ov=document.getElementById('sheet-overlay');
    if(!ov){ ov=document.createElement('div'); ov.id='sheet-overlay'; ov.className='overlay';
      ov.innerHTML='<div class="sheet" id="sheet-inner"></div>'; ov.onclick=e=>{if(e.target===ov)this.closeSheet()}; document.body.appendChild(ov); }
    document.getElementById('sheet-inner').innerHTML=(simple?'<div class="grip"></div>':'')+html;
    ov.style.display='flex';
  },
  closeSheet(){ this.stopScan(); const ov=document.getElementById('sheet-overlay'); if(ov)ov.style.display='none'; },
};
