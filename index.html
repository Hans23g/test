  async rakPublish(){
    const rows=this.state._rakRows, cats=this.state._cats||[], objs=[];
    rows.forEach((r,i)=>{
      const name=(r.name||'').trim(); if(!name)return;
      const barcode=(document.getElementById('rak-bc-'+i)?.value||'').trim();
      const price=Number(document.getElementById('rak-pr-'+i)?.value||0);
      const cost=Number(document.getElementById('rak-co-'+i)?.value||0);
      const catId=document.getElementById('rak-ca-'+i)?.value||cats[0]?.id;
      const compare_price=Number(document.getElementById('rak-cp-'+i)?.value||0);
      const tiersText=(document.getElementById('rak-ti-'+i)?.value||'').trim();
      const tiers=tiersText?tiersText.split('|').map(s=>{const p=s.split(',').map(x=>(x||'').trim());return{label:p[0],price:Number(p[1])||0};}).filter(x=>x.label&&x.price>0):null;
      objs.push({ name, barcode, sku:barcode, price, cost, compare_price, stock:Number(r.stock||0), unit:'pcs', emoji:r.emoji||'📦', category_id:catId, tiers, is_active:true, image_url:'', brand:'' });
    });
    if(!objs.length){ this.toast('Tidak ada produk valid','err'); return; }
    try{ const n=await DB.bulkUpsertProducts(objs); this.closeSheet(); this.state._rakRows=null; this.toast(n+' produk ditambahkan ke rak ✓ 🎉','ok'); this.viewProducts(); }catch(e){ this.toast('Gagal: '+(e.message||e),'err'); }
  },
  downloadTemplate(){ const csv='name,barcode,brand,price,cost,stock,unit,emoji,category_id\nIndomie Goreng,8998866200010,Indomie,3500,2800,200,pcs,🍜,cat-6\nAqua 600ml,8992753111014,Aqua,4000,3000,120,btl,💧,cat-2\n'; this.download('template_produk_toko_hana.csv',csv); },
  async doImport(){ const f=document.getElementById('csv-file').files[0]; if(!f){this.toast('Pilih file dulu','err');return;}
    const txt=await f.text(); const rows=this.parseCSV(txt); if(rows.length<2){this.toast('CSV kosong/tidak valid','err');return;}
    const header=rows[0].map(h=>h.trim().toLowerCase()); const idx={}; ['name','barcode','brand','price','cost','stock','unit','emoji','category_id'].forEach(k=>idx[k]=header.indexOf(k));
    const cats=this.state._cats||(this.state._cats=await DB.listCategories());
    const objs=[]; rows.slice(1).forEach(r=>{ if(!r.length)return; const get=c=>idx[c]>=0?(r[idx[c]]||'').trim():'';
      const name=get('name'); if(!name)return;
      let catId=get('category_id'); if(!catId||!cats.find(c=>c.id===catId)) catId=cats[0]?.id;
      objs.push({ name, barcode:get('barcode'), sku:get('barcode'), brand:get('brand'), price:Number(get('price')||0), cost:Number(get('cost')||0),
        stock:Number(get('stock')||0), unit:get('unit')||'pcs', emoji:get('emoji')||'📦', category_id:catId, is_active:true, image_url:'' }); });
    try{ const n=await DB.bulkUpsertProducts(objs); this.closeSheet(); this.toast(n+' produk diupload ✓','ok'); this.viewProducts(); }catch(e){this.toast('Gagal: '+e.message,'err');} },
  parseCSV(txt){ const rows=[]; let row=[],cur='',q=false;
    for(let i=0;i<txt.length;i++){ const ch=txt[i];
      if(q){ if(ch==='"'){ if(txt[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=ch; }
      else { if(ch==='"')q=true; else if(ch===','){row.push(cur);cur='';} else if(ch==='\n'){row.push(cur);rows.push(row);row=[];cur='';} else if(ch!=='\r')cur+=ch; } }
    if(cur||row.length){row.push(cur);rows.push(row);} return rows.filter(r=>r.some(c=>c.trim()!=='')); },
  async exportProducts(){ const prods=this.state._prods||await DB.listProducts(); const cats=this.state._cats||(this.state._cats=await DB.listCategories());
    let csv='name,barcode,brand,price,cost,stock,unit,emoji,category_id,status\n';
    prods.forEach(p=>{ csv+=[p.name,p.barcode||'',p.brand||'',p.price,p.cost,p.stock,p.unit,p.emoji||'',cats.find(c=>c.id===p.category_id)?.id||'',p.is_active?'aktif':'nonaktif'].map(x=>`"${String(x).replace(/"/g,'""')}"`).join(',')+'\n'; });
    this.download('produk_toko_hana.csv',csv); this.toast(prods.length+' produk diekspor ✓','ok'); },
  download(name,content){ const b=new Blob([content],{type:'text/csv;charset=utf-8'}); const u=URL.createObjectURL(b); const a=document.createElement('a'); a.href=u; a.download=name; a.click(); URL.revokeObjectURL(u); },

  async printReceipt(o,items,opts){

    let logoSrc='';
    if(rc.logo==='logo') logoSrc=(LOGO&&LOGO.startsWith('data:'))?LOGO:'';

    const logoImg=logoSrc?`<img src="${logoSrc}" style="height:34px;width:auto;object-fit:contain;filter:brightness(0)">`:'';

    const html=`<div class="receipt">
      ${kop}
      <div class="c">${st.tagline||'Grocery Warungnya Rakyat ID'}<br>${st.address||''}<br>Telp: ${st.phone||''}</div>
      <hr>
      <div class="l"><span>No</span><span>${o.order_no}</span></div>
      <div class="l"><span>Tgl</span><span>${new Date(o.created_at).toLocaleString('id-ID')}</span></div>
      <div class="l"><span>Kasir</span><span>${(this.state.user&&this.state.user.full_name)||'-'}</span></div>
      <div class="l"><span>Pelanggan</span><span>${o.customer_name||'-'}</span></div>
      ${kirim?`<div class="l"><span>Kirim</span><span>${kirim}</span></div>`:''}
      <hr>
      ${items.map(it=>`<div class="l"><span>${it.qty}× ${(it.name||'').slice(0,16)}</span><span>${this.money(it.subtotal)}</span></div>`).join('')}
      <hr>
      <div class="l"><span>Subtotal</span><span>${this.money(o.subtotal)}</span></div>
      ${o.discount?`<div class="l"><span>Diskon</span><span>- ${this.money(o.discount)}</span></div>`:''}
      ${o.shipping?`<div class="l"><span>Ongkir</span><span>${this.money(o.shipping)}</span></div>`:''}
      <div class="l b"><span>TOTAL</span><span>${this.money(o.total)}</span></div>
      ${opts&&opts.bonIn?`<div class="l" style="color:#c00"><span>+ Piutang lama</span><span>${this.money(opts.oldDebt)}</span></div>
      <div class="l b"><span>TOTAL BAYAR</span><span>${this.money(opts.grandTotal)}</span></div>
      <div class="l"><span>Bayar (${o.payment_method||''})</span><span>${this.money(opts.cashPaid)}</span></div>
      <div class="l"><span>↳ Bayar Bon</span><span>${this.money(opts.bayarBon)}</span></div>
      <div class="l b">${opts.sisaBon>0?'<span style="color:#c00">Sisa BON (Belum Lunas)</span><span style="color:#c00">'+this.money(opts.sisaBon)+'</span>':'<span style="color:#0c6b3f">✓ Piutang lunas semua</span><span></span>'}</div>`:`
      <div class="l"><span>Bayar (${o.payment_method||''})</span><span>${this.money(paid)}</span></div>
      <div class="l b">${(Number(o.change_amount||0)<0)?'<span style="color:#c00">BON (Belum Lunas)</span><span style="color:#c00">'+this.money(Math.abs(Number(o.change_amount||0)))+'</span>':'<span>Kembali</span><span>'+this.money(o.change_amount||0)+'</span>'}</div>`}
      ${o.points_earned?`<div class="l"><span>Poin +</span><span>${o.points_earned}</span></div>`:''}
      <div id="rcpt-note-line">${o.struk_note?`<hr><div class="b" style="text-align:center;border:1.5px dashed #000;padding:6px;margin:4px 0;font-size:13px">${(o.struk_note||'').replace(/</g,'&lt;')}</div>`:''}</div>
      <hr>
      <div class="c">★ Terima kasih ★<br>Selamat berbelanja kembali<br><small>Simpan struk ini sebagai bukti</small></div>
    </div>`;

  doPrintReceipt(){
    const preview=document.getElementById('receipt-preview'); if(!preview)return;
    const area=document.getElementById('print-area');
    area.innerHTML=preview.innerHTML;
    area.classList.remove('hide');
    const cleanup=()=>{ area.classList.add('hide'); window.removeEventListener('afterprint',cleanup); };
    window.addEventListener('afterprint',cleanup);
    setTimeout(()=>{ window.print(); }, 250);
    setTimeout(cleanup, 60000);
  },

  initBannerCarousel(){
    const track=document.getElementById('btrack'); if(!track)return;
    const n=track.children.length; if(n<=1)return;
    const car=document.getElementById('bcarousel');
    const dots=document.getElementById('bdots');
    if(dots) dots.innerHTML=Array.from({length:n}).map((_,i)=>`<button class="dot${i===0?' active':''}" onclick="App.bannerGo(${i})" aria-label="Banner ${i+1}"></button>`).join('');
    const go=(i)=>{ if(!track.isConnected){clearInterval(this._bTimer);return;} this._bIdx=((i%n)+n)%n; track.style.transform=`translateX(-${this._bIdx*100}%)`; document.querySelectorAll('#bdots .dot').forEach((d,k)=>d.classList.toggle('active',k===this._bIdx)); };
    this._bGo=go; this._bIdx=0; this._bRestart();
    if(car){ let sx=0,dx=0;
      car.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;dx=0;clearInterval(this._bTimer);},{passive:true});
      car.addEventListener('touchmove',e=>{dx=e.touches[0].clientX-sx;},{passive:true});
      car.addEventListener('touchend',()=>{ if(Math.abs(dx)>40){ dx<0?go((this._bIdx||0)+1):go((this._bIdx||0)-1);} this._bRestart(); },{passive:true});
    }

  _bRestart(){ clearInterval(this._bTimer); if(this._bGo) this._bTimer=setInterval(()=>this._bGo(((this._bIdx||0)+1)),4500); },

  readImageJpeg(file,max,q=0.7){ return new Promise((resolve,reject)=>{ const r=new FileReader(); r.onload=()=>{ const img=new Image(); img.onload=()=>{ let w=img.width,h=img.height; if(w>h){if(w>max){h=h*max/w;w=max;}}else{if(h>max){w=w*max/h;h=max;}} const c=document.createElement('canvas'); c.width=w;c.height=h; c.getContext('2d').drawImage(img,0,0,w,h); resolve(c.toDataURL('image/jpeg',q)); }; img.onerror=()=>reject(new Error('Gambar tidak valid')); img.src=r.result; }; r.onerror=()=>reject(new Error('Gagal baca file')); r.readAsDataURL(file); }); },
  readSquare(file,max){ return new Promise((resolve,reject)=>{ const r=new FileReader(); r.onload=()=>{ const img=new Image(); img.onload=()=>{ const s=Math.min(img.width,img.height), sx=(img.width-s)/2, sy=(img.height-s)/2; const c=document.createElement('canvas'); c.width=max;c.height=max; c.getContext('2d').drawImage(img,sx,sy,s,s,0,0,max,max); resolve(c.toDataURL('image/png')); }; img.onerror=()=>reject(new Error('Gambar tidak valid')); img.src=r.result; }; r.onerror=()=>reject(new Error('Gagal baca file')); r.readAsDataURL(file); }); },

  saveSupaCfg(){

    if(!url||!key){ this.toast('URL & key wajib diisi','err'); return; }

  async testSupaCfg(){
    const url=(document.getElementById('supa-url')?.value||'').trim();
    const key=(document.getElementById('supa-key')?.value||'').trim();
    const res=document.getElementById('supa-test-result');
    if(!url||!key){ this.toast('Isi URL & key dulu','err'); return; }
    if(res) res.innerHTML='<span class="muted small">⏳ Menguji koneksi ke DB...</span>';
    const out=(cls,txt)=>{ if(res) res.innerHTML='<span class="'+cls+'">'+txt+'</span>'; };
    let error=null;
    try{
      if(!window.supabase||typeof window.supabase.createClient!=='function') throw new Error('Library Supabase belum termuat (cek internet).');
      const tmp=window.supabase.createClient(url,key);
      const probe=new Promise(function(resolve){ tmp.from('categories').select('id').limit(1).then(function(r){resolve(r);}).catch(function(e){resolve({error:e});}); });
      const to=new Promise(function(resolve){ setTimeout(function(){resolve({__to:true});},8000); });
      const got=await Promise.race([probe,to]);
      if(got.__to) throw new Error('Timeout (8 dtk) — DB tidak merespon');
      error=got.error||null;
    }catch(e){ error=e; }
    const m=(error&&error.message)||(''+error);
    if(error && /timeout|fetch|network|Failed to fetch|ERR|belum termuat|merespon/i.test(m)){
      out('tag','❌ Gagal: '+m); this.toast('Koneksi gagal','err'); return;
    }
    if(error && /could not find|does not exist|relation|schema|categories/i.test(m)){
      out('tag amber','⚠️ Terhubung, tapi skema belum lengkap — run <b>HanaPOS_setup.sql</b>'); this.toast('Terhubung, skema blm siap','err'); return;
    }
    if(error){ out('tag','❌ Gagal: '+m); this.toast('Koneksi gagal','err'); return; }
    out('tag green','✅ Terhubung & skema OK! DB siap dipakai.'); this.toast('Koneksi OK ✓','ok');
  },

  payMethods(){
    const p=this.state._pay||{}; const m=[];
    if(p.cod?.on!==false)m.push({id:'cod',label:'💵 COD (Bayar di Tempat)'});
    if(p.transfer?.on&&p.transfer?.number)m.push({id:'transfer',label:'🏦 Transfer '+p.transfer.bank});
    if(p.qris?.on&&p.qris?.data)m.push({id:'qris',label:'📱 QRIS'});
    if(p.ewallet?.on&&p.ewallet?.number)m.push({id:'ewallet',label:'💸 '+p.ewallet.provider});
    return m.length?m:[{id:'cod',label:'COD (Bayar di Tempat)'}];
  },
  payDetail(id){
    const p=this.state._pay||{};
    if(id==='qris')return `<div style="text-align:center;margin:10px 0"><img src="${p.qris?.data}" style="width:100%;max-width:320px;height:auto;display:block;margin:0 auto;border-radius:8px"><p class="small" style="margin-top:8px;font-weight:700;color:var(--navy)">Scan QRIS untuk bayar</p><p class="muted small" style="margin-top:4px">Sudah bayar melalui QRIS? Tulis konfirmasi di kolom keterangan.</p></div>`;
    if(id==='transfer')return `<div class="card" style="background:var(--blue-ll);padding:14px;margin:10px 0"><b>Transfer ke:</b><br><br>Bank: <b>${p.transfer?.bank}</b><br>No. Rek: <b class="kbd" style="font-size:16px;letter-spacing:1px">${p.transfer?.number}</b><br>a.n. <b>${p.transfer?.name}</b><br><br><p class="muted small">Sudah transfer? Tulis jumlah & waktu di kolom keterangan, lalu klik Pesan via WhatsApp.</p></div>`;
    if(id==='ewallet')return `<div class="card" style="background:var(--blue-ll);padding:14px;margin:10px 0"><b>Kirim ke:</b><br><br>${p.ewallet?.provider}: <b class="kbd" style="font-size:16px">${p.ewallet?.number}</b><br>a.n. <b>${p.ewallet?.name}</b><br><br><p class="muted small">Sudah kirim? Tulis konfirmasi di kolom keterangan, lalu klik Pesan via WhatsApp.</p></div>`;
    if(id==='cod')return `<div class="card" style="background:var(--green-l);padding:14px;margin:10px 0"><b>💵 COD (Cash on Delivery)</b><br><br><p class="small">Bayar tunai saat pesanan sampai. Kasir akan mengantarkan pesananmu.</p></div>`;
    return '';
  },
  async saveFavicon(){ const f=document.getElementById('fav-file').files[0]; if(!f){this.toast('Pilih file gambar dulu','err');return;} if(f.size>2*1024*1024){this.toast('Maks 2MB','err');return;}
    try{ const data=await this.readSquare(f,128); await DB.saveSettings('favicon',{data}); document.querySelectorAll('link[rel="icon"],link[rel="apple-touch-icon"]').forEach(l=>l.setAttribute('href',data)); this.toast('Favicon disimpan ✓ & langsung dipakai','ok'); }catch(e){this.toast('Gagal: '+(e.message||e),'err');} },
  async resetFavicon(){ if(!confirm('Reset favicon ke default (favicon.png)?'))return; try{ await DB.saveSettings('favicon',{data:null}); document.querySelectorAll('link[rel="icon"],link[rel="apple-touch-icon"]').forEach(l=>l.setAttribute('href','favicon.png')); this.toast('Favicon direset ✓','ok'); }catch(e){this.toast('Gagal','err');} },
  async saveLogo(){ const f=document.getElementById('logo-file').files[0]; if(!f){this.toast('Pilih file gambar dulu','err');return;} if(f.size>3*1024*1024){this.toast('Maks 3MB','err');return;}
    try{ const data=await this.readImage(f,600); await DB.saveSettings('logo',{data}); LOGO=data; document.querySelectorAll('.logo-img').forEach(i=>i.src=data); this.toast('Logo disimpan ✓ & dipakai di header','ok'); }catch(e){this.toast('Gagal: '+(e.message||e),'err');} },
  async resetLogo(){ if(!confirm('Reset logo ke default?'))return; try{ await DB.saveSettings('logo',{data:null}); LOGO=LOGO_DEFAULT; document.querySelectorAll('.logo-img').forEach(i=>i.src=LOGO_DEFAULT); this.toast('Logo direset ✓','ok'); }catch(e){this.toast('Gagal','err');} },
  async addBanner(){ const f=document.getElementById('banner-file').files[0]; if(!f){this.toast('Pilih gambar dulu','err');return;} if(f.size>3*1024*1024){this.toast('Maks 3MB','err');return;}
    try{ const data=await this.readImage(f,900); const items=(this.state._banners||[]).slice();
      items.push({data, title:(document.getElementById('bn-title')?.value||'').trim(), desc:(document.getElementById('bn-desc')?.value||'').trim(), link:(document.getElementById('bn-link')?.value||'').trim()});
      this.state._banners=items; await DB.saveSettings('banners',{items}); this.renderSetTab('brand',await DB.getSettings()); this.toast('Banner ditambah ✓','ok');
    }catch(e){this.toast('Gagal: '+(e.message||e),'err');} },
  async updateBanner(i,field,val){ const items=(this.state._banners||[]).slice(); if(!items[i])return; items[i]={...items[i],[field]:val}; this.state._banners=items; await DB.saveSettings('banners',{items}); },
  async deleteBanner(i){ if(!confirm('Hapus banner '+(i+1)+'?'))return;
    try{ const items=(this.state._banners||[]).slice(); items.splice(i,1); this.state._banners=items; await DB.saveSettings('banners',{items}); this.renderSetTab('brand',await DB.getSettings()); this.toast('Banner dihapus ✓','ok'); }catch(e){this.toast('Gagal','err');} },

  /* ===================== DRAWER (menu geser) ===================== */
  openDrawer(){
    const u=this.state.user;
    let head, body, isForm=false;
    if(u){
      head=`<div class="row" style="gap:12px;min-width:0">${u.avatar_url?`<img src="${u.avatar_url}" style="width:42px;height:42px;border-radius:50%;object-fit:cover;flex:none">`:`<div class="av">${(u.full_name||'?')[0]}</div>`}<div class="col" style="min-width:0"><b style="font-size:15px">${u.full_name||'Pengguna'}</b><div style="opacity:.9;font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${u.email||''}</div></div></div>`;
      let items=[];
      if(this.state.user.role==='kurir') items=[['courier-home','Home',IC.home],['courier-orders','Antar',IC.bag],['courier-profile','Profil',IC.user]];
      else if(this.isAdmin()) items=[['store','Home',IC.home],['products','Produk',IC.box],['pos','Kasir',IC.scan],['online-orders','Order Online',IC.bag],['members','Member',IC.users],['reports','Laporan',IC.chart],['piutang','Piutang','💰'],...(this.state.user.role==='admin'?[['dashboard','Dashboard',IC.grid],['settings','Pengaturan',IC.settings]]:[])];
      else items=[['store','Toko',IC.store],['cart','Keranjang',IC.cart],['orders','Pesanan',IC.list],['card','Kartu Member',IC.card],['points','Poin & Referral',IC.coin],['profile','Profil',IC.user]];
      body=items.map(([v,l,ic])=>`<div class="drawer-item" onclick="App.drawerGo('${v}')">${ic}<span>${l}</span>${v==='cart'?'<span class="cart-badge hide" id="cart-count" style="margin-left:auto;background:var(--rose)"></span>':''}</div>`).join('')
        +`<div class="drawer-item" onclick="App.toggleDarkMode()">${this.state._darkMode?'☀️':'🌙'}<span>${this.state._darkMode?'Mode Terang':'Mode Malam'}</span></div>`
        +`<div class="drawer-item rose" onclick="App.doLogout()">${IC.logout}<span>Keluar</span></div>`;
    } else {
      head=`<div style="text-align:center;padding:4px 0"><div style="font-size:32px">👋</div><b style="font-size:16px;display:block;margin-top:2px">Halo, Sobat Toko Hana!</b><div style="opacity:.92;font-size:12px;margin-top:2px">Masuk untuk belanja, kumpulkan poin & referral</div></div>`;
      body=this.authBodyMarkup(); isForm=true;
    }
    let ov=document.getElementById('drawer-overlay');
    if(!ov){ ov=document.createElement('div'); ov.id='drawer-overlay'; ov.className='overlay';
      ov.style.justifyContent='flex-end'; ov.style.alignItems='stretch';
      ov.onclick=(e)=>{ if(e.target===ov) this.closeDrawer(); }; document.body.appendChild(ov); }
    ov.innerHTML=`<div class="drawer">
      <div class="drawer-head">${head}<button style="background:#fff;color:var(--navy);width:32px;height:32px;border-radius:8px;flex:none;display:flex;align-items:center;justify-content:center;cursor:pointer;border:none;box-shadow:0 2px 8px rgba(0,0,0,.15)" onclick="App.closeDrawer()"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div>
      <div class="drawer-body">${body}</div>
    </div>`;
    ov.style.display='flex';
    if(isForm) this.bindAuth(()=>{ this.closeDrawer(); this.toast('Berhasil masuk ✓','ok'); this.renderApp(); });
    this.updateCartBadge();
  },
  closeDrawer(){ const ov=document.getElementById('drawer-overlay'); if(ov)ov.style.display='none'; },
  drawerGo(v){ this.closeDrawer(); location.hash=v; },

  /* ===================== MODAL / SHEET ===================== */
  openSheet(html,simple){
    let ov=document.getElementById('sheet-overlay');
    if(!ov){ ov=document.createElement('div'); ov.id='sheet-overlay'; ov.className='overlay';
      ov.innerHTML='<div class="sheet" id="sheet-inner"></div>'; ov.onclick=e=>{if(e.target===ov)this.closeSheet()}; document.body.appendChild(ov); }
    document.getElementById('sheet-inner').innerHTML=(simple?'<div class="grip"></div>':'')+html;
    ov.style.display='flex';
  },
  closeSheet(){ this.stopScan(); const ov=document.getElementById('sheet-overlay'); if(ov)ov.style.display='none'; },
};
