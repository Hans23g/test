<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#285FF4" />
<meta name="description" content="Toko Hana — Grocery Warungnya Rakyat ID. Kasir offline + toko online terpusat Supabase." />
<title>Toko Hana — Grocery Warungnya Rakyat ID</title>
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="icon" href="favicon.png" />
<link rel="apple-touch-icon" href="favicon.png" />
<style>
/* ============================ THEME (BCA-inspired) ============================ */
:root{
  --navy:#285FF4; --ac2:#285FF4; --navy-2:#3D6FF5; --blue:#5782F6; --blue-l:#E9EFFD; --blue-ll:#F4F7FE;
  --accent:#0090E0; --accent-2:#00BFA6; --gold:#F5A623; --rose:#E11D48;
  --green:#1FA463; --green-l:#E6F6EE; --amber:#F59E0B; --amber-l:#FEF3C7;
  --ink:#10243B; --ink-2:#41586F; --ink-3:#7C8CA0; --line:#E4EAF1;
  --bg:#EDF2FE; --card:#fff; --shadow:0 1px 2px rgba(16,36,59,.05),0 6px 18px rgba(16,36,59,.06);
  --shadow-lg:0 10px 40px rgba(16,36,59,.16); --r:16px; --r-s:10px;
  --maxw:1180px; --bar-h:60px; --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;max-width:100%}
body{font-family:'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);
  font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
a{color:var(--blue);text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input,select,textarea{font-family:inherit;font-size:15px}
h1,h2,h3,h4{margin:0;font-weight:800;letter-spacing:-.01em}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 16px;width:100%}
.muted{color:var(--ink-3)}.small{font-size:12.5px}
.rupiah{font-variant-numeric:tabular-nums}
.tag{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:700;background:var(--blue-l);color:var(--blue)}
.tag.green{background:var(--green-l);color:var(--green)} .tag.amber{background:var(--amber-l);color:#A5640A}
.tag.rose{background:#FDE8EC;color:var(--rose)} .tag.gray{background:#EEF2F7;color:var(--ink-3)}
.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.col{flex:1;min-width:0}.grow{flex:1}
.grid{display:grid;gap:12px}.hide{display:none!important}.center{text-align:center}
.spin{width:34px;height:34px;border:3px solid var(--blue-l);border-top-color:var(--blue);border-radius:50%;animation:sp 1s linear infinite;margin:40px auto}
@keyframes sp{to{transform:rotate(360deg)}}
.skel{background:linear-gradient(90deg,#eef2f7 25%,#f7fafc 37%,#eef2f7 63%);background-size:400% 100%;animation:sk 1.4s infinite}
@keyframes sk{0%{background-position:100% 0}100%{background-position:-100% 0}}

/* ============================ SPLASH ============================ */
.splash{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(var(--navy,#285FF4),var(--blue,#5782F6));color:#fff;text-align:center;padding:24px;animation:spIn .4s ease}
@keyframes spIn{from{opacity:0}to{opacity:1}}
.splash .sp-logo{position:relative;display:flex;align-items:center;justify-content:center;margin-bottom:22px}
.splash .sp-logo::before{content:"";position:absolute;left:50%;top:50%;width:240px;height:210px;max-width:94vw;transform:translate(-50%,-50%);background:radial-gradient(ellipse at center,rgba(255,255,255,.5),rgba(255,255,255,.16) 42%,rgba(255,255,255,0) 70%);z-index:0;pointer-events:none}
.splash .sp-logo img{position:relative;z-index:1;width:auto;height:104px;max-width:72vw;object-fit:contain}
.splash .sp-letter{position:relative;z-index:1;width:104px;height:104px;border-radius:30px;background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;font-size:48px;font-weight:900;box-shadow:0 12px 32px rgba(0,0,0,.28);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.splash .sp-name{font-size:25px;font-weight:800;letter-spacing:-.01em;text-shadow:0 2px 8px rgba(0,0,0,.22);max-width:90%}
.splash .sp-tag{font-size:13px;opacity:.92;margin-top:5px;max-width:84%}
.splash .sp-bar{width:210px;max-width:62vw;height:5px;border-radius:99px;background:rgba(255,255,255,.28);overflow:hidden;margin-top:28px;position:relative}
.splash .sp-bar>i{position:absolute;left:0;top:0;height:100%;width:38%;border-radius:99px;background:#fff;box-shadow:0 0 12px rgba(255,255,255,.7);animation:spbar 1.15s cubic-bezier(.45,0,.55,1) infinite}
@keyframes spbar{0%{left:-40%}100%{left:100%}}
.splash .sp-dots{display:flex;gap:9px;justify-content:center;margin-top:28px}.splash .sp-dots>i{width:11px;height:11px;border-radius:50%;background:#fff;animation:spdot 1.2s ease-in-out infinite}
.splash .sp-dots>i:nth-child(2){animation-delay:.18s}.splash .sp-dots>i:nth-child(3){animation-delay:.36s}
@keyframes spdot{0%,60%,100%{transform:translateY(0);opacity:.45}30%{transform:translateY(-12px);opacity:1}}
.splash .sp-pulse{display:flex;justify-content:center;margin-top:28px}.splash .sp-pulse>i{width:44px;height:44px;border-radius:50%;border:3px solid rgba(255,255,255,.85);animation:sppulse 1.1s ease-in-out infinite}
@keyframes sppulse{0%,100%{transform:scale(.65);opacity:.4}50%{transform:scale(1);opacity:1}}
.splash .sp-ring{display:flex;justify-content:center;margin-top:28px}.splash .sp-ring>i{width:40px;height:40px;border-radius:50%;border:4px solid rgba(255,255,255,.3);border-top-color:#fff;animation:sping 1s linear infinite}
@keyframes sping{to{transform:rotate(360deg)}}
.splash .sp-eq{display:flex;gap:5px;height:32px;justify-content:center;margin-top:28px}.splash .sp-eq>i{width:6px;height:100%;border-radius:3px;background:#fff;animation:speq .9s ease-in-out infinite}
.splash .sp-eq>i:nth-child(2){animation-delay:.18s}.splash .sp-eq>i:nth-child(3){animation-delay:.36s}.splash .sp-eq>i:nth-child(4){animation-delay:.09s}.splash .sp-eq>i:nth-child(5){animation-delay:.27s}
@keyframes speq{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1)}}
.splash .sp-foot{position:absolute;bottom:22px;font-size:11px;opacity:.72;letter-spacing:.02em}
/* preview mini di editor splash */
.sp-prev{position:relative;height:182px;border-radius:14px;overflow:hidden;box-shadow:var(--shadow);margin-bottom:14px}
.sp-prev .splash{position:absolute;inset:0;animation:none}
.sp-prev .sp-logo{margin-bottom:8px}
.sp-prev .sp-logo::before{width:96px;height:84px}
.sp-prev .sp-logo img{height:40px;max-width:52%}
.sp-prev .sp-letter{width:40px;height:40px;font-size:20px;border-radius:13px}
.sp-prev .sp-name{font-size:13px}
.sp-prev .sp-tag{font-size:9px;margin-top:2px}
.sp-prev .sp-bar{width:80px;height:3px;margin-top:10px}
.sp-prev .sp-dots{margin-top:10px}.sp-prev .sp-dots>i{width:7px;height:7px}
.sp-prev .sp-pulse{margin-top:10px}.sp-prev .sp-pulse>i{width:24px;height:24px;border-width:2px}
.sp-prev .sp-ring{margin-top:10px}.sp-prev .sp-ring>i{width:22px;height:22px;border-width:3px}
.sp-prev .sp-eq{margin-top:10px;height:18px;gap:3px}.sp-prev .sp-eq>i{width:4px}
.sp-prev .sp-foot{font-size:8px;bottom:6px}

/* ============================ BUTTONS ============================ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 16px;border-radius:12px;font-weight:700;
  background:var(--navy);color:#fff;transition:.15s;font-size:14.5px;white-space:nowrap}
.btn:hover{filter:brightness(1.08);transform:translateY(-1px)}
.btn:active{transform:none}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn.blue{background:var(--blue)} .btn.green{background:var(--green)} .btn.amber{background:var(--amber)} .btn.rose{background:var(--rose)}
.btn.accent{background:var(--accent)} .btn.dark{background:var(--ink)}
.btn.ghost{background:#fff;color:var(--navy);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.ghost:hover{box-shadow:inset 0 0 0 1.5px var(--blue);color:var(--blue)}
.btn.sm{padding:8px 12px;font-size:13px;border-radius:10px}
.btn.xs{padding:5px 9px;font-size:12px;border-radius:8px}
.btn.block{width:100%}
.iconbtn{width:42px;height:42px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;background:#fff;box-shadow:inset 0 0 0 1.5px var(--line);color:var(--ink-2)}
.iconbtn:hover{color:var(--blue)}
.fab{position:fixed;right:16px;bottom:calc(74px + var(--safe-b));z-index:40;width:58px;height:58px;border-radius:50%;background:var(--navy);color:#fff;
  box-shadow:0 8px 24px rgba(0,61,122,.4);display:flex;align-items:center;justify-content:center}
.fab svg{width:26px;height:26px}

/* ============================ APP BAR ============================ */
.topbar{position:sticky;top:0;z-index:30;background:var(--bg);color:var(--ink);padding-top:env(safe-area-inset-top)}
.topbar .wrap{display:flex;align-items:center;gap:10px;height:var(--bar-h)}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:15.5px;color:var(--ink);flex:none;margin-right:6px}
.brand .logo{width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,var(--navy),var(--blue));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:19px;box-shadow:0 3px 8px rgba(0,61,122,.3)}
.brand .logo-img{height:42px;width:auto;max-width:220px;object-fit:contain;flex:none}
@media(max-width:520px){.brand .logo-img{height:36px;max-width:160px}}
.brand small{display:block;font-weight:600;color:var(--ink-3);font-size:10px;letter-spacing:.02em}
.topbar .search-pill{flex:1;display:flex;align-items:center;gap:8px;background:#fff;border:1px solid rgba(0,61,122,.1);border-radius:999px;padding:0 12px;min-width:0;height:34px;transition:.15s}
.topbar .search-pill:focus-within{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-l)}
.topbar .search-pill svg{width:15px;height:15px;color:var(--ink-3);flex:none}
.topbar .search-pill input{border:none;background:none;outline:none;flex:1;font-size:13px;min-width:0;color:var(--ink)}
.topbar .menu-btn{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--ac2);flex:none}
.topbar .menu-btn:hover{background:var(--blue-l)}
.topbar .menu-btn svg{width:24px;height:24px}
.topbar .spacer{flex:1}
.chip-points{display:inline-flex;align-items:center;gap:6px;background:var(--blue-l);color:var(--blue);padding:7px 13px;border-radius:999px;font-weight:800;font-size:13px;flex:none}
.chip-points svg{width:16px;height:16px;color:var(--gold)}
/* promo banner + kategori + drawer */
.promo-banner{background:linear-gradient(120deg,var(--navy),var(--blue));color:#fff;border-radius:18px;padding:18px 20px;margin-bottom:14px;position:relative;overflow:hidden;cursor:pointer}
.promo-banner::after{content:"";position:absolute;right:-30px;top:-30px;width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.1)}
.promo-banner h3{font-size:17px;margin:0;position:relative;z-index:1}.promo-banner p{opacity:.92;font-size:12.5px;margin:4px 0 0;position:relative;z-index:1}
.promo-banner .promo-cta{display:inline-block;margin-top:10px;background:var(--gold);color:#5b3700;font-weight:800;font-size:12px;padding:6px 13px;border-radius:999px;position:relative;z-index:1}
.banner-carousel{position:relative;border-radius:14px;overflow:hidden;margin:10px 0 14px;background:var(--blue-ll)}
.banner-track{display:flex;transition:transform .55s cubic-bezier(.4,0,.2,1);will-change:transform}
.banner-slide{flex:0 0 100%;min-width:0;cursor:pointer;position:relative;overflow:hidden}
.banner-slide img{width:100%;max-height:100px;min-height:56px;object-fit:cover;display:block}
.banner-dots{position:absolute;bottom:9px;left:0;right:0;display:flex;justify-content:center;gap:6px;z-index:3}
.banner-dots .dot{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.65);cursor:pointer;transition:.25s;border:none}
.banner-dots .dot.active{background:#fff;width:20px;border-radius:4px}
.banner-arrow{position:absolute;top:50%;transform:translateY(-50%);width:32px;height:48px;background:none;color:#fff;font-size:32px;line-height:48px;font-weight:300;text-align:center;z-index:4;cursor:pointer;border:none;text-shadow:0 1px 8px rgba(0,0,0,.5);opacity:.85}
.banner-arrow:hover{opacity:1}
.banner-arrow.prev{left:0}.banner-arrow.next{right:0}
.banner-cap{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:flex-end;background:linear-gradient(to top,rgba(0,20,50,.82),transparent);z-index:2;pointer-events:none}
.banner-cap .bc-inner{padding:14px 28px 14px 28px;color:#fff;max-width:100%}
.banner-cap .bc-title{font-weight:800;font-size:15px;text-shadow:0 1px 4px rgba(0,0,0,.5)}
.banner-cap .bc-desc{font-size:12px;opacity:.95;margin-top:2px;text-shadow:0 1px 4px rgba(0,0,0,.5)}
.cat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
.cat-tile{display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;padding:6px 0}
.cat-tile .cat-ico{width:48px;height:48px;border-radius:12px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:24px;box-shadow:var(--shadow);transition:.15s}
.cat-tile:hover .cat-ico{transform:translateY(-2px)}
.cat-tile span{font-size:10px;font-weight:700;color:var(--ink-2);text-align:center;line-height:1.2;max-width:62px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cat-tile.active .cat-ico{background:var(--ac2)}.cat-tile.active span{color:var(--ac2)}
.cats .cat-tile{width:48px;flex:none}
.cat-dropdown{background:#fff;border-radius:16px;box-shadow:var(--shadow-lg);padding:8px;margin-bottom:14px;display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.cat-dropdown.hide{display:none}
.cat-dropdown .dd-item{padding:12px 8px;border-radius:11px;font-weight:700;font-size:12.5px;cursor:pointer;text-align:center;color:var(--ink-2)}
.cat-dropdown .dd-item.on{background:var(--blue-l);color:var(--navy)}
.drawer{background:#fff;width:300px;max-width:84vw;height:100%;margin-left:auto;box-shadow:-8px 0 30px rgba(0,20,50,.18);display:flex;flex-direction:column;animation:drw .25s ease;padding-top:env(safe-area-inset-top)}
@keyframes drw{from{transform:translateX(40px);opacity:.6}to{transform:none;opacity:1}}
.drawer-head{padding:18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;background:linear-gradient(120deg,var(--navy),var(--blue));color:#fff;gap:10px}
.drawer-head .av{width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;font-weight:800;flex:none}
.drawer-body{padding:10px;overflow:auto}
.drawer-item{display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:12px;font-weight:700;font-size:14px;color:var(--ink-2);cursor:pointer}
.drawer-item svg{width:20px;height:20px;flex:none;color:var(--ac2)}
.drawer-item:hover{background:var(--blue-ll)}.drawer-item.rose{color:var(--rose)}.drawer-item.rose svg{color:var(--rose)}

/* ============================ LAYOUT ============================ */
.shell{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - var(--bar-h))}
.sidebar{background:#fff;border-right:1px solid var(--line);padding:14px 12px;position:sticky;top:var(--bar-h);height:calc(100vh - var(--bar-h));overflow:auto}
.nav-item{display:flex;align-items:center;gap:12px;padding:11px 13px;border-radius:12px;color:var(--ink-2);font-weight:700;font-size:14px;margin-bottom:3px;cursor:pointer}
.nav-item:hover{background:var(--blue-ll)}
.nav-item.active{background:var(--navy);color:#fff}
.nav-item svg{width:20px;height:20px;flex:none}
.nav-sec{font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);padding:14px 13px 6px}
.main{padding:18px 16px 100px;min-width:0;overflow-x:clip}
.content{max-width:var(--maxw);margin:0 auto}

/* mobile bottom nav */
.bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:35;background:var(--card);
  border-top:1px solid var(--line);
  display:none;padding:8px 4px calc(3px + var(--safe-b));justify-content:space-around;box-shadow:0 -2px 16px rgba(0,0,0,.05)}
.bn-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:0;color:var(--ink-3);font-size:10px;font-weight:700;border-radius:8px}
.bn-item.active{color:var(--navy)} .bn-item svg{width:20px;height:20px}
.bn-badge{position:absolute;background:var(--rose);color:#fff;font-size:10px;font-weight:800;min-width:17px;height:17px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 4px}

/* ============================ CARDS / GRID ============================ */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:16px}
.section-title{display:flex;align-items:center;justify-content:space-between;margin:18px 0 12px}
.section-title h2{font-size:18px} .section-title a{font-size:13px;font-weight:700}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.stat{background:#fff;border-radius:var(--r);box-shadow:var(--shadow);padding:15px}
.stat .lbl{font-size:12px;color:var(--ink-3);font-weight:700;display:flex;align-items:center;gap:6px}
.stat .lbl .ic{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;background:var(--blue-l);color:var(--blue)}
.stat .val{font-size:22px;font-weight:800;margin-top:9px;letter-spacing:-.02em}
.stat .sub{font-size:11.5px;color:var(--green);font-weight:700;margin-top:2px}

/* promo / product grid (BCA style) */
.cats{display:flex;gap:27px;overflow-x:auto;padding:4px 0 10px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat-pill{flex:none;display:flex;align-items:center;gap:7px;padding:9px 15px;border-radius:999px;background:#fff;box-shadow:inset 0 0 0 1.5px var(--line);font-weight:700;font-size:13px;color:var(--ink-2);cursor:pointer}
.cat-pill.active{background:var(--navy);color:#fff;border-color:var(--navy)}
.prod-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:13px}
.prod{background:#fff;border-radius:10px;overflow:hidden;box-shadow:var(--shadow);cursor:pointer;transition:.15s;display:flex;flex-direction:column;position:relative}
.prod:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
.prod .ph{aspect-ratio:4/3;background:var(--blue-ll);position:relative;overflow:hidden}
.prod .ph .emoji{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:52px}
.prod .ph img{width:100%;height:100%;object-fit:cover}
.prod .disc-badge{position:absolute;left:7px;top:7px;background:var(--rose);color:#fff;font-size:10px;font-weight:800;padding:2px 7px;border-radius:6px;z-index:2}
.prod .info{padding:5px 8px 6px;flex:1;display:flex;flex-direction:column}
.prod .nm{font-weight:600;font-size:13.5px;line-height:1.15;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.prod .unit{font-size:10px;color:var(--ink-3);margin-top:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prod .pr{font-weight:800;color:var(--ac2);margin-top:auto;padding-top:2px;font-size:14px;line-height:1.1}
.prod .old{font-size:10.5px;color:var(--ink-3);text-decoration:line-through;font-weight:600;margin-top:2px}
.prod .add-fab{position:absolute;right:7px;bottom:7px;width:30px;height:30px;border-radius:8px;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 7px rgba(0,0,0,.18);z-index:3}
.prod .add-fab svg{width:18px;height:18px}
.prod .add-fab:disabled{background:var(--ink-3);opacity:.6}
.prod .add-fab.guest{background:#fff;color:var(--navy)}

/* ============================ POS ============================ */
.pos-grid{display:grid;grid-template-columns:1fr 380px;gap:14px;align-items:start}
.pos-search{display:flex;gap:8px;margin-bottom:10px}
.search-box{flex:1;display:flex;align-items:center;gap:9px;background:#fff;border-radius:12px;box-shadow:inset 0 0 0 1.5px var(--line);padding:0 13px;height:46px}
.search-box input{border:none;outline:none;background:none;flex:1;font-size:14.5px}
.search-box svg{width:19px;height:19px;color:var(--ink-3)}
.pos-prods{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-height:calc(100vh - 250px);overflow:auto;padding-right:4px}
.pos-prods .prod .ph .emoji{font-size:44px} .pos-prods .prod .nm{min-height:0;font-size:12.5px}
.pos-prods .prod .info{padding:8px 9px 9px}
/* hasil search = list (dropdown style) */
.pos-searchlist{display:block!important;max-height:none;padding:0}
.pos-searchlist .sli{display:flex;align-items:center;gap:12px;padding:11px 12px;cursor:pointer;background:#fff;border-radius:10px;margin-bottom:6px;box-shadow:var(--shadow);transition:.12s}
.pos-searchlist .sli:hover{background:var(--blue-l)}
.pos-searchlist .sli:active{transform:scale(.99)}
.pos-searchlist .sli .em{font-size:24px;width:32px;text-align:center;flex:none}
.pos-searchlist .sli .nm{font-size:14px}
.pos-searchlist .sli .pr{font-weight:800;color:var(--navy);font-size:14px;flex:none;white-space:nowrap}
/* dropdown search melayang (glass/transparan) di bawah kotak search */
.pos-dropdown{position:absolute;top:calc(100% + 4px);left:0;right:0;background:rgba(255,255,255,.75);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-radius:14px;box-shadow:var(--shadow-lg);max-height:340px;overflow:auto;z-index:30;border:1px solid rgba(255,255,255,.6);padding:6px}
.pos-dropdown .ddi{display:flex;align-items:center;gap:12px;padding:10px 12px;cursor:pointer;border-radius:10px;transition:.12s}
.pos-dropdown .ddi:hover,.pos-dropdown .ddi:active{background:rgba(40,95,244,.14)}
.pos-dropdown .ddi .em{font-size:24px;width:30px;text-align:center;flex:none}
.pos-dropdown .ddi .col{flex:1;min-width:0}
.pos-dropdown .ddi .nm{font-size:14px;font-weight:700;line-height:1.2}
.pos-dropdown .ddi .sub{font-size:11px;color:var(--ink-3);margin-top:1px}
.pos-dropdown .ddi .pr{font-weight:800;color:var(--navy);flex:none;white-space:nowrap}
.cart-panel{background:#fff;border-radius:var(--r);box-shadow:var(--shadow);position:sticky;top:78px;display:flex;flex-direction:column;max-height:calc(100vh - 100px)}
.cart-head{padding:14px 16px;border-bottom:1px solid var(--line)}
.cart-items{flex:1;overflow:auto;padding:6px 16px;min-height:120px}
.ci{display:flex;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line)}
.ci .ic{width:42px;height:42px;border-radius:10px;background:var(--blue-ll);display:flex;align-items:center;justify-content:center;font-size:22px;flex:none}
.ci .nm{font-weight:700;font-size:13px;line-height:1.2}
.ci .pr{font-size:12px;color:var(--ink-3);margin-top:2px}
.qty{display:inline-flex;align-items:center;background:var(--bg);border-radius:8px;margin-top:5px}
.qty button{width:26px;height:26px;font-weight:900;font-size:16px;color:var(--navy)}
.qty span{min-width:28px;text-align:center;font-weight:800;font-size:13px}
.cart-foot{padding:14px 16px;border-top:1px solid var(--line)}
.sum-line{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px;color:var(--ink-2)}
.sum-line.tot{font-size:18px;font-weight:800;color:var(--ink);margin:8px 0 12px}

/* ============================ TABLE ============================ */
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);padding:10px 12px;border-bottom:1.5px solid var(--line)}
.tbl td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:hover td{background:var(--blue-ll)}
.tbl .em{text-align:center;padding:30px;color:var(--ink-3)}
.tablewrap{background:#fff;border-radius:var(--r);box-shadow:var(--shadow);overflow:auto}

/* ============================ FORM ============================ */
.field{margin-bottom:13px}
.field label{display:block;font-size:12.5px;font-weight:700;margin-bottom:5px;color:var(--ink-2)}
.field input,.field select,.field textarea{width:100%;padding:11px 13px;border-radius:11px;border:1.5px solid var(--line);outline:none;background:#fff;transition:.15s}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-l)}
.field .hint{font-size:11.5px;color:var(--ink-3);margin-top:4px}
.field.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* ============================ MODAL ============================ */
.overlay{position:fixed;inset:0;background:rgba(8,20,35,.55);z-index:60;display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(2px)}
.sheet{background:#fff;width:100%;max-width:560px;border-radius:10px 10px 0 0;max-height:92vh;overflow:auto;animation:up .25s ease}
.sheet.lg{max-width:760px}
@keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
.sheet-head{position:sticky;top:0;background:#fff;padding:16px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;z-index:2;border-radius:22px 22px 0 0}
.sheet-head h3{font-size:17px}
.sheet-body{padding:18px}
.grip{width:42px;height:5px;background:var(--line);border-radius:99px;margin:8px auto 0}
.modal-c{position:fixed;inset:0;background:rgba(8,20,35,.55);z-index:60;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:#fff;border-radius:18px;max-width:440px;width:100%;max-height:92vh;overflow:auto;animation:up .2s ease}

/* ============================ AUTH ============================ */
.auth-bg{min-height:100vh;background:linear-gradient(135deg,var(--navy),var(--navy-2) 55%,var(--blue));display:flex;align-items:center;justify-content:center;padding:18px}
.auth-card{background:#fff;border-radius:24px;max-width:430px;width:100%;overflow:hidden;box-shadow:0 24px 70px rgba(0,20,50,.4)}
.auth-hero{background:linear-gradient(120deg,var(--navy),var(--blue));color:#fff;padding:26px 24px;text-align:center}
.auth-hero .logo{width:60px;height:60px;border-radius:18px;background:#fff;color:var(--navy);font-weight:900;font-size:30px;display:flex;align-items:center;justify-content:center;margin:0 auto 12px}
.auth-hero h1{font-size:21px} .auth-hero p{opacity:.9;font-size:13px;margin-top:4px}
.auth-body{padding:22px 24px 26px}
.tabs{display:flex;background:var(--bg);border-radius:12px;padding:4px;margin-bottom:18px}
.tabs button{flex:1;padding:9px;border-radius:9px;font-weight:700;color:var(--ink-3);font-size:14px}
.tabs button.active{background:#fff;color:var(--navy);box-shadow:var(--shadow)}

/* ============================ MEMBER CARD ============================ */
.membercard{background:linear-gradient(135deg,var(--navy),var(--blue));color:#fff;border-radius:20px;padding:18px;position:relative;overflow:hidden;box-shadow:var(--shadow-lg)}
.membercard::before{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.08)}
.membercard::after{content:"";position:absolute;right:30px;bottom:-60px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.06)}
.membercard .lvl{position:absolute;right:16px;top:14px;background:var(--gold);color:#5b3700;font-weight:800;font-size:11px;padding:4px 10px;border-radius:99px}
.membercard .mc-logo{display:flex;align-items:center;gap:8px;font-weight:800}
.membercard .mc-logo .l{width:30px;height:30px;border-radius:8px;background:#fff;color:var(--navy);display:flex;align-items:center;justify-content:center;font-weight:900}
.membercard .mc-name{font-size:20px;font-weight:800;margin-top:18px}
.membercard .mc-no{font-size:12px;opacity:.85;letter-spacing:.08em;margin-top:2px}
.membercard .mc-bar{background:#fff;border-radius:10px;padding:8px;margin-top:14px;text-align:center}
.membercard .mc-pts{display:flex;justify-content:space-between;margin-top:14px;font-size:12px}
.membercard .mc-pts b{display:block;font-size:17px;margin-top:2px}

/* ============================ TOAST ============================ */
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--ink);color:#fff;padding:11px 18px;border-radius:12px;font-size:13.5px;font-weight:600;box-shadow:var(--shadow-lg);animation:tin .3s;display:flex;align-items:center;gap:8px}
.toast.ok{background:var(--green)} .toast.err{background:var(--rose)}
@keyframes tin{from{opacity:0;transform:translateY(10px)}to{opacity:1}}
.bar{height:6px;background:var(--line);border-radius:99px;overflow:hidden}.bar>i{display:block;height:100%;background:var(--blue)}
hr.sep{border:none;border-top:1px solid var(--line);margin:14px 0}
.kbd{font-family:monospace;background:var(--bg);padding:2px 7px;border-radius:6px;font-size:12px}

/* ============================ HERO BANNER ============================ */
.hero-banner{background:linear-gradient(115deg,var(--navy),var(--blue));color:#fff;border-radius:20px;padding:22px 24px;position:relative;overflow:hidden;margin-bottom:16px}
.hero-banner h2{font-size:22px}.hero-banner p{opacity:.9;font-size:13px;margin-top:4px;max-width:70%}
.hero-banner .badge-pts{position:absolute;right:18px;bottom:14px;background:var(--gold);color:#5b3700;font-weight:800;padding:8px 14px;border-radius:14px;font-size:13px;display:flex;gap:6px;align-items:center}

/* ============================ SCANNER ============================ */
#scan-region{width:100%;border-radius:14px;overflow:hidden;background:#000;min-height:260px}
#scan-region video{border-radius:14px}
/* modal scan barcode — TURUN DARI ATAS, compact (hanya yg perlu) */
.scan-overlay{position:fixed;inset:0;background:rgba(8,20,35,.4);z-index:70;display:none;align-items:flex-start;justify-content:center;backdrop-filter:blur(1px)}
.scan-box{background:var(--card);width:100%;max-width:360px;border-radius:0 0 18px 18px;box-shadow:var(--shadow-lg);animation:drop .3s cubic-bezier(.4,0,.2,1);overflow:hidden}
@keyframes drop{from{transform:translateY(-110%);opacity:.3}to{transform:translateY(0);opacity:1}}
.scan-box .scan-head{padding:12px 16px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:space-between}
.scan-box .scan-head h3{font-size:15px;color:#fff;margin:0}
.scan-box .scan-body{padding:10px}
.scan-box #scan-region{height:140px;min-height:0;max-height:32vh;border-radius:12px;overflow:hidden}
.scan-box #scan-region video,.scan-box #scan-region canvas,.scan-box #scan-region img{height:140px!important;width:100%!important;object-fit:cover;border-radius:12px;display:block}
.scan-close-btn{background:#fff;color:var(--navy);width:38px;height:38px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;border:1.5px solid var(--line);flex:none;box-shadow:var(--shadow)}
.scan-close-btn:hover{background:var(--blue-l);border-color:var(--blue);color:var(--blue)}
.scan-label{position:absolute;bottom:6px;left:0;right:0;text-align:center;color:#fff;font-size:11px;font-weight:800;letter-spacing:3px;z-index:21;text-shadow:0 1px 4px rgba(0,0,0,.7);pointer-events:none;text-transform:uppercase;opacity:.85}
/* efek laser scan sangar — stage, garis laser, sudut bidik, glow */
.scan-stage{position:relative;width:100%;border-radius:12px;overflow:hidden;background:#000}
.scan-stage #scan-region{border-radius:12px}
.scan-stage::after{content:"";position:absolute;inset:0;z-index:14;background:radial-gradient(circle at center,transparent 52%,rgba(0,0,0,.4));pointer-events:none;animation:scanglow 1.8s ease-in-out infinite}
@keyframes scanglow{0%,100%{opacity:.55}50%{opacity:1}}
.scan-laser{position:absolute;left:5%;right:5%;height:3px;top:10%;z-index:20;border-radius:3px;pointer-events:none;
  background:linear-gradient(90deg,transparent,#00ff9d 18%,#00f0ff 50%,#00ff9d 82%,transparent);
  box-shadow:0 0 16px 4px rgba(0,255,157,.9),0 0 32px 8px rgba(0,240,255,.45);animation:lasersweep 1.8s cubic-bezier(.45,0,.55,1) infinite}
.scan-laser::after{content:"";position:absolute;left:0;right:0;top:2px;height:70px;background:linear-gradient(180deg,rgba(0,255,157,.22),transparent)}
@keyframes lasersweep{0%{top:8%}50%{top:90%}100%{top:8%}}
.scan-corners i{position:absolute;width:26px;height:26px;border:3px solid #00ff9d;z-index:20;box-shadow:0 0 10px rgba(0,255,157,.65);pointer-events:none}
.scan-corners i:nth-child(1){top:10px;left:10px;border-right:0;border-bottom:0;border-radius:9px 0 0 0}
.scan-corners i:nth-child(2){top:10px;right:10px;border-left:0;border-bottom:0;border-radius:0 9px 0 0}
.scan-corners i:nth-child(3){bottom:10px;left:10px;border-right:0;border-top:0;border-radius:0 0 0 9px}
.scan-corners i:nth-child(4){bottom:10px;right:10px;border-left:0;border-top:0;border-radius:0 0 9px 0}

/* ============================ RECEIPT ============================ */
.receipt{font-family:'Courier New',monospace;width:300px;margin:0 auto;color:#000}
.receipt h4{font-size:15px;text-align:center;margin:0}.receipt .c{text-align:center;font-size:11px}
.receipt hr{border:none;border-top:1px dashed #000;margin:6px 0}.receipt .l{display:flex;justify-content:space-between;font-size:12px;margin:2px 0}
.receipt .b{font-weight:bold;font-size:13px}
@media print{body *{visibility:hidden}#print-area,#print-area *{visibility:visible}#print-area{position:absolute;left:0;top:0;width:100%}}

/* ============================ RESPONSIVE ============================ */
@media(max-width:1080px){.prod-grid{grid-template-columns:repeat(4,1fr)}.pos-prods{grid-template-columns:repeat(3,1fr)}}
@media(min-width:521px){.banner-slide img{max-height:140px}}
@media(min-width:769px){.banner-slide img{max-height:200px}}
@media(max-width:880px){
  .shell{grid-template-columns:1fr}.sidebar{display:none}.main{padding:14px 14px 96px}
  .bottomnav{display:flex}
  .prod-grid{grid-template-columns:repeat(3,1fr)}.pos-grid{grid-template-columns:1fr}
  .pos-prods{grid-template-columns:repeat(3,1fr);max-height:none}
  .cart-panel{position:static;max-height:none}.stat-grid{grid-template-columns:repeat(2,1fr)}
  .overlay{align-items:flex-end}
  /* rapikan mobile: bungkus tombol & grid */
  .section-title{flex-wrap:wrap;align-items:center;gap:8px}
  .section-title>.row,.section-title>div>.row{flex-wrap:wrap;width:100%;gap:8px}
  .section-title .btn{flex:1 1 auto;min-width:0;padding:9px 10px;font-size:13px}
  .charts-grid{grid-template-columns:1fr!important}
  .quick-grid{grid-template-columns:repeat(2,1fr)!important}
  .topbar .wrap{gap:6px}
  .tbl{font-size:12.5px}
  .membercard .mc-name{font-size:18px}
}
@media(max-width:520px){
  :root{--bar-h:52px}
  .brand .logo-img{height:34px;max-width:140px}
  .prod .ph{aspect-ratio:3/2}
  .prod-grid{grid-template-columns:repeat(2,1fr);gap:9px}.pos-prods{grid-template-columns:repeat(2,1fr);gap:9px}
  .prod .ph .emoji{font-size:38px}
  .prod .add-fab{width:26px;height:26px}.prod .add-fab svg{width:16px;height:16px}
  .prod .info{padding:4px 7px 5px}.prod .nm{font-size:11.5px;line-height:1.12}.prod .pr{font-size:13px}
  .brand small{display:none}.topbar .brand-text{display:none}
  .field.row2{grid-template-columns:1fr}
}
.empty{text-align:center;padding:50px 20px;color:var(--ink-3)}
.empty svg{width:54px;height:54px;opacity:.4;margin-bottom:10px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}.dot.on{background:var(--green)}.dot.off{background:var(--ink-3)}
.pill-toggle{display:flex;flex-wrap:wrap;gap:3px;background:var(--bg);border-radius:10px;padding:3px}.pill-toggle button{flex:1 1 auto;min-width:64px;padding:8px 10px;border-radius:8px;font-weight:700;font-size:12px;color:var(--ink-3);white-space:nowrap}.pill-toggle button.active{background:#fff;color:var(--navy);box-shadow:var(--shadow)}

/* ============================ AUTH (pro) ============================ */
.auth-tabs{display:flex;gap:5px;background:var(--bg);border-radius:14px;padding:5px;margin-bottom:18px}
.auth-tabs button{flex:1;padding:11px;border-radius:10px;font-weight:800;font-size:14px;color:var(--ink-3);transition:.15s}
.auth-tabs button.active{background:#fff;color:var(--navy);box-shadow:var(--shadow)}
.auth-note{background:var(--amber-l);border:1.5px solid #FCD9A0;color:#A5640A;font-size:13px;padding:10px 12px;border-radius:10px;margin-bottom:14px}
.field .input-wrap{display:flex;align-items:center;gap:10px;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:0 13px;transition:.15s}
.field .input-wrap svg{width:18px;height:18px;color:var(--ink-3);flex:none}
.field .input-wrap input{border:none!important;background:none!important;outline:none;box-shadow:none!important;padding:13px 0!important;flex:1;font-size:15px;border-radius:0}
.field .input-wrap:focus-within{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-l)}
.auth-submit{margin-top:6px;padding:14px;font-size:15px}
.auth-demo-toggle{text-align:center;margin-top:18px;font-size:12.5px;color:var(--ink-3)}
.auth-demo-toggle b{color:var(--blue);cursor:pointer}

/* ============================ DARK MODE ============================ */
[data-theme="dark"] [style*="background:#fff"],
[data-theme="dark"] [style*="background: #fff"],
[data-theme="dark"] [style*="background:white"],
[data-theme="dark"] .btn.ghost,
[data-theme="dark"] .iconbtn,
[data-theme="dark"] .search-box,
[data-theme="dark"] .cat-pill,
[data-theme="dark"] .cat-dropdown,
[data-theme="dark"] .prod,
[data-theme="dark"] .bottomnav,
[data-theme="dark"] .sidebar,
[data-theme="dark"] .sheet,
[data-theme="dark"] .sheet-head,
[data-theme="dark"] .drawer,
[data-theme="dark"] .stat,
[data-theme="dark"] .tablewrap,
[data-theme="dark"] .modal,
[data-theme="dark"] .tabs button.active,
[data-theme="dark"] .auth-tabs button.active,
[data-theme="dark"] .cat-tile .cat-ico,
[data-theme="dark"] .pill-toggle button.active,
[data-theme="dark"] .qty,
[data-theme="dark"] .ci .ic,
[data-theme="dark"] .cart-panel,
[data-theme="dark"] .pos-dropdown,
[data-theme="dark"] .membercard .mc-bar { background: var(--card) !important; }
[data-theme="dark"] .prod .ph { background: rgba(255,255,255,.04) !important; }
[data-theme="dark"] .prod .add-fab.guest { background: var(--card) !important; color: var(--ink) !important; }
[data-theme="dark"] .ci .ic { background: rgba(255,255,255,.06) !important; }
[data-theme="dark"] .prod .pr { color: var(--ac2) !important; }
[data-theme="dark"] .membercard .mc-bar { background: rgba(255,255,255,.95) !important; }
[data-theme="dark"] .membercard .mc-logo .l { background: rgba(255,255,255,.9) !important; }
[data-theme="dark"] [style*="background:var(--bg)"] { background: rgba(255,255,255,.04) !important; }
[data-theme="dark"] [style*="background:var(--blue-ll)"] { background: rgba(255,255,255,.06) !important; }
[data-theme="dark"] [style*="background:var(--blue-l)"] { background: rgba(255,255,255,.08) !important; }
[data-theme="dark"] input, [data-theme="dark"] select, [data-theme="dark"] textarea {
  background: rgba(255,255,255,.06) !important; color: var(--ink) !important; border-color: var(--line) !important; }
[data-theme="dark"] .field input:focus, [data-theme="dark"] .field select:focus, [data-theme="dark"] .field textarea:focus {
  border-color: var(--blue) !important; }
[data-theme="dark"] .input-wrap { background: rgba(255,255,255,.06) !important; }
[data-theme="dark"] .input-wrap input { background: none !important; }
[data-theme="dark"] .tbl tr:hover td { background: rgba(255,255,255,.03); }
[data-theme="dark"] .skel { background: rgba(255,255,255,.06); }
.theme-swatch{width:40px;height:40px;border-radius:50%;cursor:pointer;border:3px solid transparent;transition:.15s;flex:none}
.theme-swatch.on{border-color:var(--ink);transform:scale(1.1)}
.theme-presets{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}
/* tombol geser kategori — gede & gampang di-tap jempol (min 38px) */
.cat-move{height:40px;padding:0 14px;border-radius:10px;border:1.5px solid var(--line);background:#fff;color:var(--navy);font-size:12.5px;font-weight:800;cursor:pointer;display:inline-flex;align-items:center;gap:6px;min-width:48px;justify-content:center;transition:.15s;-webkit-tap-highlight-color:transparent}
.cat-move:hover:not(:disabled){background:var(--blue-l);border-color:var(--blue)}
.cat-move:active:not(:disabled){transform:scale(.94)}
.cat-move:disabled{opacity:.32;cursor:not-allowed;background:var(--bg)}
.cat-move.del{color:var(--rose)}
.cat-move.del:hover:not(:disabled){background:#FDE8EC;border-color:var(--rose)}
.cat-row{background:var(--bg);padding:8px;border-radius:12px;margin-bottom:8px}
</style>
</head>
<body>

<!-- ============================ AUTH SCREEN ============================ -->
<div id="auth-root"><div class="splash"><div class="sp-logo"><div class="sp-letter">H</div></div><div class="sp-name">Toko Hana</div><div class="sp-tag">Grocery Warungnya Rakyat ID</div><div class="sp-bar"><i></i></div><div class="sp-foot">Powered by HanaPOS CMS · v1.0 (Beta)</div></div></div>

<!-- ============================ MAIN APP ============================ -->
<div id="app-root" class="hide"></div>

<!-- toast + scan mount -->
<div id="toast"></div>

  /* ---- orders ---- */
  async function createOrder(order, items, opts={}){
    if(!isDemo){
      // Semua operasi (order + item + kurangi stok + catat poin) dijalankan
      // di SERVER via RPC place_order (SECURITY DEFINER) -> aman & lewati RLS.
      const {data:o,error}=await sb.rpc('place_order',{ p_order: order, p_items: items, p_customer_id: order.customer_id||null });
      if(error) throw error;
      return o;
    }
    const d=load(); const id=uid(); d.seq.order=(d.seq.order||1000)+1;
    const o={...order,id,order_no:order.order_no||('INV'+d.seq.order),created_at:now(),updated_at:now()};
    d.orders[id]=o; items.forEach(it=>{ const iid=uid(); d.items[iid]={...it,id:iid,order_id:id,created_at:now()}; });
    o.points_awarded=false;
    if(o.customer_id){ const m=d.profiles[o.customer_id]; if(m){ m.points = (m.points||0) - (o.points_used||0);
      if(o.points_used>0) d.points[uid()]={id:uid(),member_id:m.id,order_id:id,type:'redeem',points:-o.points_used,note:'Tukar poin '+o.order_no,created_at:now()}; } }
    // points_earned DI-DEFER — baru dikredit pas order lunas (awardOrderPoints)
    // kurangi stok
    items.forEach(it=>{ const pr=Object.values(d.products).find(p=>p.id===it.product_id); if(pr){pr.stock=Math.max(0,(pr.stock||0)-Number(it.qty)); pr.sold=(pr.sold||0)+Number(it.qty||0);} });
    save(d); return o;
  }

  /* KREDIT poin earn HANYA saat order lunas (change>=0, status ok) & belum pernah dikredit.
     live: RPC award_order_points (idempoten); demo: client-side. */
  async function awardOrderPoints(id){
    if(!isDemo){
      const {error}=await sb.rpc('award_order_points',{ p_order_id:id });
      if(error && !/Could not find|does not exist|award_order_points/i.test(error.message||'')) throw error;
      return;
    }
    const d=load(); const o=d.orders[id]; if(!o) return;
    if(o.points_awarded) return;
    if(['pending','cancelled','rejected'].includes(o.status)) return;   // belum bayar / batal
    if(Number(o.change_amount||0)<0) return;                            // masih bon -> defer
    if(o.points_earned>0 && o.customer_id){ const m=d.profiles[o.customer_id]; if(m){ m.points=(m.points||0)+o.points_earned;
      d.points[uid()]={id:uid(),member_id:m.id,order_id:id,type:'earn',points:o.points_earned,note:'Belanja '+o.order_no,created_at:now()}; } }
    o.points_awarded=true; save(d);
  }

  async function updateOrderStatus(id,status,patch={}){
    if(!isDemo){ const {data,error}=await sb.from('orders').update({status,...patch}).eq('id',id).select().single(); if(error)throw error; return data; }
    const d=load(); Object.assign(d.orders[id],{status,...patch,updated_at:now()}); save(d); return d.orders[id];
  }
  /* LUNASIN BON/PIUTANG — live: RPC server-side (lewati RLS, atomic); demo: client FIFO.
     return = sisa bon member. Lempar error khusus kalau RPC blm dibuat (fallback ke updateOrderStatus). */
  async function settleBon(memberId, amount){
    if(!isDemo){
      const {data,error}=await sb.rpc('settle_bon',{ p_member_id:memberId, p_amount:Math.max(0,Math.round(amount)) });
      if(error){
        const m=(error.message||'')+'';
        // RPC belum dibuat -> beri sinyal spesifik biar doPayBon fallback ke updateOrderStatus
        if(/Could not find|function.*does not exist|settle_bon/i.test(m)) throw new Error('__NORPC__');
        throw error;
      }
      return Number(data)||0;
    }
    // DEMO: FIFO client-side
    const d=load(); let remaining=Math.max(0,Math.round(amount));
    const ids=Object.values(d.orders)
      .filter(o=>o.customer_id===memberId && Number(o.change_amount||0)<0 && !['pending','cancelled','rejected'].includes(o.status))
      .sort((a,b)=>(a.created_at||'').localeCompare(b.created_at||''));
    for(const o of ids){ if(remaining<=0)break; const bon=-Number(o.change_amount||0); if(bon<=0)continue;
      const apply=Math.min(remaining,bon); o.change_amount=Number(o.change_amount)+apply; o.paid_amount=Number(o.paid_amount||0)+apply; o.updated_at=now(); remaining-=apply; }
    // award poin earn untuk order yg baru jadi lunas (bon hilang)
    Object.values(d.orders).filter(o=>o.customer_id===memberId&&!o.points_awarded&&!['pending','cancelled','rejected'].includes(o.status)&&Number(o.change_amount||0)>=0&&o.points_earned>0).forEach(o=>{ const m=d.profiles[o.customer_id]; if(m){ m.points=(m.points||0)+o.points_earned; d.points[uid()]={id:uid(),member_id:m.id,order_id:o.id,type:'earn',points:o.points_earned,note:'Lunas BON '+o.order_no,created_at:now()}; o.points_awarded=true; } });
    save(d);
    return Object.values(d.orders).filter(o=>o.customer_id===memberId&&Number(o.change_amount||0)<0&&!['pending','cancelled','rejected'].includes(o.status)).reduce((s,o)=>s+Math.abs(Number(o.change_amount||0)),0);
  }
  /* batalkan order + kembalikan stok */
  async function cancelOrder(id){
    if(!isDemo){
      const {data:items}=await sb.from('order_items').select('product_id,qty').eq('order_id',id);
      await sb.from('orders').update({status:'cancelled'}).eq('id',id);
      for(const it of (items||[])){ const {data:pr}=await sb.from('products').select('stock,sold').eq('id',it.product_id).maybeSingle();
        if(pr) await sb.from('products').update({stock:(pr.stock||0)+Number(it.qty),sold:Math.max(0,(pr.sold||0)-Number(it.qty))}).eq('id',it.product_id).catch(()=>{}); }
      return;
    }
    const d=load(); if(d.orders[id]) d.orders[id].status='cancelled';
    Object.values(d.items).filter(x=>x.order_id===id).forEach(it=>{ const pr=Object.values(d.products).find(p=>p.id===it.product_id);
      if(pr){ pr.stock=(pr.stock||0)+Number(it.qty); pr.sold=Math.max(0,(pr.sold||0)-Number(it.qty)); } });
    save(d);
  }

  async function listMembers(search=''){

  /* daftar member yg punya BON/PIUTANG (change_amount<0, status bukan pending/cancelled/rejected) */
  async function listDebtors(){
    const bad=['pending','cancelled','rejected'];
    const ords=await listOrders({});
    const debts={};
    for(const o of ords){ const ch=Number(o.change_amount||0); if(ch<0&&!bad.includes(o.status)&&o.customer_id){ debts[o.customer_id]=(debts[o.customer_id]||0)+Math.abs(ch); } }
    const profiles=await listAllProfiles('');
    const map={}; profiles.forEach(p=>map[p.id]=p);
    return Object.keys(debts).filter(id=>map[id]).map(id=>({...map[id],_bon:debts[id]})).sort((a,b)=>b._bon-a._bon);
  }

  /* ---- stats ---- */
  async function stats(){

      const today=new Date(); const y=today.toISOString().slice(0,10);
      const [ordCnt, memCnt, ordData, prodCnt]=await Promise.all([
        sb.from('orders').select('*',{count:'exact',head:true}).in('status',['paid','completed']),
        sb.from('profiles').select('*',{count:'exact',head:true}).eq('role','member'),
        sb.from('orders').select('total,channel,status,created_at').in('status',['paid','completed']),
        sb.from('products').select('*',{count:'exact',head:true})
      ]);
      const sales=ordData.data||[];
      const revenue=sales.reduce((a,b)=>a+Number(b.total||0),0);
      const todayRev=sales.filter(o=>o.created_at&&o.created_at.startsWith(y)).reduce((a,b)=>a+Number(b.total||0),0);
      const online=sales.filter(o=>o.channel==='online').length, offline=sales.filter(o=>o.channel==='offline').length;
      return {revenue,orders:ordCnt.count||sales.length,members:memCnt.count||0,todayRev,online,offline,products:prodCnt.count||0,sales};
    }
    const d=ensureSeed(); const sales=Object.values(d.orders).filter(o=>['paid','completed'].includes(o.status));
    const today=new Date().toISOString().slice(0,10);
    return { revenue:sales.reduce((a,b)=>a+Number(b.total||0),0), orders:sales.length,
      members:Object.values(d.profiles).filter(x=>x.role==='member').length,
      todayRev:sales.filter(o=>o.created_at.startsWith(today)).reduce((a,b)=>a+Number(b.total||0),0),
      online:sales.filter(o=>o.channel==='online').length, offline:sales.filter(o=>o.channel==='offline').length,
      products:Object.keys(d.products).length, sales };

  /* ===================== ROUTER ===================== */
  route(){
    const h=(location.hash||'').replace('#','')||'store';
    this.state.view=h;
    const el=document.querySelector('.sidebar')||document.querySelector('.bottomnav');
    document.querySelectorAll('.nav-item,.bn-item').forEach(x=>x.classList.toggle('active',x.dataset.v===h));
    if(window.scrollTo) window.scrollTo(0,0);
    const v=document.getElementById('view'); if(!v)return;
    // TAMU (belum login): hanya katalog publik
    if(!this.state.user){ this.viewStore(); return; }
    if(this.state.user.role==='kurir'){
      ({'courier-home':()=>this.viewCourierHome(),'courier-orders':()=>this.viewCourierOrders(),'courier-profile':()=>this.viewCourierProfile()}[h]||(()=>this.viewCourierHome()))();
      return;
    }
    if(this.isAdmin()){
      const isBoss=this.state.user.role==='admin';
      if(['store','cart','product'].includes(h)) { return this.viewStore(true); } // admin lihat toko
      // kasir diblokir akses manajemen (Dashboard & Pengaturan) -> redirect ke Kasir
      if((h==='settings'||h==='dashboard') && !isBoss){ this.toast('🔒 '+(h==='settings'?'Pengaturan':'Dashboard')+' hanya untuk Admin','err'); location.hash='pos'; return; }
      const fb=isBoss?()=>this.viewDashboard():()=>this.viewPOS();
      ({dashboard:()=>this.viewDashboard(),pos:()=>this.viewPOS(),products:()=>this.viewProducts(),
        'online-orders':()=>this.viewOnlineOrders(),members:()=>this.viewMembers(),
        piutang:()=>this.viewPiutang(),
        staff:()=>{ this.state._memMode='all'; this.viewMembers(); },
        reports:()=>this.viewReports(),
        settings:()=>this.viewSettings(),storeview:()=>this.viewStore(true)
      }[h]||fb)();
    } else {
      ({store:()=>this.viewStore(),cart:()=>this.viewCart(),orders:()=>this.viewMemberOrders(),
        card:()=>this.viewMemberCard(),points:()=>this.viewMemberPoints(),referral:()=>this.viewReferral(),
        profile:()=>this.viewMemberProfile()
      }[h]||this.viewStore)();
    }
  },

  applyFilter(){

    const perPage=window.innerWidth<=520?12:24;

    const maxBtn=7; let s=Math.max(1,pg-3), e=Math.min(total,s+maxBtn-1); s=Math.max(1,e-maxBtn+1);

    if(e<total){ if(e<total-1) html+='<span class="muted" style="padding:5px">…</span>'; html+=`<button class="btn xs ghost" onclick="App.goPage(${total})">${total}</button>`; }

  cartQty(i,d){ const it=this.state.cart[i]; const nv=it.qty+d; if(nv<=0){this.cartRemove(i);return;} if(nv>it.stock){this.toast('Stok tidak cukup','err');return;} it.qty=nv; this.viewCart(); this.updateCartBadge(); },

  calcCart(){ const sub=this.state.cart.reduce((a,b)=>a+b.price*b.qty,0);

    const estPts=Math.max(0,Math.floor((sub-disc)/CONFIG.EARN_PER_RP*tr.mult));
    tot-=tierDisc;
    const pd=document.getElementById('pts-disc'),gt=document.getElementById('grand-tot'),sl=document.getElementById('ship-line');
    if(pd)pd.textContent='- '+this.money(disc+tierDisc)+(tierDisc>0?` (poin+tier)`:'');

    const ep=document.getElementById('est-pts'); if(ep) ep.innerHTML=`<span class="tag green">🎁 +${estPts} poin${tr.mult>1?` (tier ${tr.lvl} x${tr.mult})`:''}</span> <span class="muted small">— poin masuk setelah transaksi <b>selesai/dibayar</b></span>`;

  /* hitung ongkir berdasar metode pengiriman + deteksi zona dari alamat */
  calcShip(){

    const detail=document.getElementById('ship-detail'); let ship=0, info='';
    if(m==='pickup'){ ship=0; info='<div class="card" style="background:var(--green-l);padding:10px;margin:0 0 10px;font-size:12.5px"><b>🏪 Ambil di Toko</b> — Gratis. Pembeli ambil sendiri.</div>'; }

    } else { ship=0; info=`<div class="card" style="background:var(--amber-l);padding:10px;margin:0 0 10px;font-size:12.5px"><b>🎒 Ekspedisi Luar Daerah</b> — ongkir bayar ke ekspedisi (${(this.state._delivery?.expedisi||'JNE/J&T')}). Admin input no. resi setelah dikirim.</div>`; }
    if(detail) detail.innerHTML=info;
    this.state._ship=ship; this.state._shipMethod=m; this.calcCart();

  detectZone(addrText){

  async placeOrder(){
    if(this.state._ordering) return;  // 🔒 anti-double
    if(!this.state.cart.length)return;
    const sub=this.state.cart.reduce((a,b)=>a+b.price*b.qty,0);
    const use=Math.min(Number(document.getElementById('use-pts').value||0),this.state.user.points||0);
    const disc=use*CONFIG.REDEEM_VALUE;
    const dm=this.state._shipMethod||'pickup'; const ship=this.state._ship||0;
    let dz=''; if(dm==='antar'){ dz=document.getElementById('ship-zone')?.value || this.detectZone((document.getElementById('addr')?.value||'').toLowerCase()).id; }
    const tr=this.tierOf(this.state.user.points||0);
    const tierDisc=(tr.on&&tr.disc>0)?Math.round((sub-disc+ship)*tr.disc/100):0;
    const tot=sub-disc+ship-tierDisc;
    const addr=document.getElementById('addr').value.trim(); if(dm!=='pickup' && !addr){this.toast('Alamat wajib diisi untuk pengantaran','err');return;}
    const ptsEarn=Math.max(0,Math.floor((sub-disc)/CONFIG.EARN_PER_RP*tr.mult));
    const order={ order_no:'ONL'+Date.now().toString().slice(-8), customer_id:this.state.user.id, customer_name:this.state.user.full_name,
      channel:'online', status:'pending', subtotal:sub, discount:disc+tierDisc, points_used:use, points_earned:ptsEarn, shipping:ship,
      delivery_method:dm, delivery_zone:dz,
      total:tot, address:addr, note:document.getElementById('note').value, payment_method:document.getElementById('pay-method')?.value||'COD' };
    const items=this.state.cart.map(it=>({product_id:it.product_id,name:it.name,price:it.price,qty:it.qty,subtotal:it.price*it.qty}));
    this.state._ordering=true;
    try{
      const o=await DB.createOrder(order,items);
      await DB.awardOrderPoints(o.id).catch(()=>{});   // poin defer: baru masuk pas selesai/dibayar
      this.state.user.points=(this.state.user.points||0)-use;
      this.state.cart=[]; this.updateCartBadge();

  async orderViaWhatsApp(){
    if(this.state._ordering) return;  // 🔒 anti-double
    const c=this.state.cart; if(!c.length){this.toast('Keranjang kosong','err');return;}
    const u=this.state.user;
    let ph=(this.state._storePhone||'').replace(/\D/g,'');
    if(!ph){this.toast('Set nomor WA di Pengaturan → Profil Toko','err');return;}
    if(!ph.startsWith('62')) ph=ph.startsWith('0')?'62'+ph.slice(1):'62'+ph;
    const sub=c.reduce((a,b)=>a+b.price*b.qty,0);
    const usePts=Math.min(Number(document.getElementById('use-pts')?.value||0),u.points||0,Math.floor(sub/CONFIG.REDEEM_VALUE));
    const disc=usePts*CONFIG.REDEEM_VALUE;
    const dm=this.state._shipMethod||'pickup'; const ship=this.state._ship||0;
    let dz=''; if(dm==='antar'){ dz=document.getElementById('ship-zone')?.value || this.detectZone((document.getElementById('addr')?.value||'').toLowerCase()).id; }
    const tr=this.tierOf(this.state.user.points||0);
    const tierDisc=(tr.on&&tr.disc>0)?Math.round((sub-disc+ship)*tr.disc/100):0;
    const tot=sub-disc+ship-tierDisc;
    const addr=document.getElementById('addr')?.value?.trim(); if(dm!=='pickup' && !addr){this.toast('Alamat wajib diisi','err');return;}
    const note=(document.getElementById('note')?.value||'').trim();
    const payEl=document.getElementById('pay-method'); const pay=payEl?.value||'COD (Bayar di tempat)';
    const waNote=(document.getElementById('wa-note')?.value||'').trim();
    const ptsEarn=Math.max(0,Math.floor((sub-disc)/CONFIG.EARN_PER_RP*tr.mult));
    // 1) buat order dulu (sama kayak placeOrder tapi dengan payment_method + note WA)
    const order={ order_no:'ONL'+Date.now().toString().slice(-8), customer_id:u.id, customer_name:u.full_name,
      channel:'online', status:'pending', subtotal:sub, discount:disc+tierDisc, points_used:usePts, points_earned:ptsEarn, shipping:ship,
      delivery_method:dm, delivery_zone:dz,
      total:tot, address:addr, note:(note?note+'\n':'')+'[Order via WhatsApp'+(waNote?' — '+waNote:'')+']', payment_method:pay };
    const items=c.map(it=>({product_id:it.product_id,name:it.name,price:it.price,qty:it.qty,subtotal:it.price*it.qty}));
    this.state._ordering=true;
    try{
      const o=await DB.createOrder(order,items);
      await DB.awardOrderPoints(o.id).catch(()=>{});
      this.state.user.points=(this.state.user.points||0)-usePts;
      // 2) format WA
      const itemList=items.map((it,i)=>`${i+1}. ${it.name}\n    ${it.qty} ${it.unit||'pcs'} × ${this.money(it.price)} = ${this.money(it.subtotal)}`).join('\n');
      const msg=
`═══════════════
🛒 *PESANAN BARU*
═══════════════
No. Order: *${o.order_no}*
Dari: *${u.full_name}*

───────────────
📦 *DETAIL PESANAN*
───────────────
${itemList}

───────────────
💰 *RINGKASAN*
───────────────
Subtotal: ${this.money(sub)}
${disc>0?`Diskon Poin: -${this.money(disc)}\n`:''}${ship>0?`Ongkir: ${this.money(ship)}\n`:''}*TOTAL: ${this.money(tot)}*

───────────────
🚚 *PENGIRIMAN*
───────────────
Nama: ${u.full_name}
WA/HP: ${u.phone||'-'}
Alamat: ${addr}
Catatan: ${note||'-'}

───────────────
💳 *PEMBAYARAN*
───────────────
Metode: *${pay}*
${waNote?`\n📝 *KET. PEMBAYARAN:*\n${waNote}\n`:''}
═══════════════
_Pesan via HanaPOS CMS — ${o.order_no}_
═══════════════`;
      // 3) kosongkan keranjang & buka WA
      this.state.cart=[]; this.updateCartBadge();
      window.open(`https://wa.me/${ph}?text=${encodeURIComponent(msg)}`,'_blank');
      this.toast('Pesanan dibuat ✓ & WA dibuka','ok');
      // 4) tampilkan konfirmasi
      this.openSheet(`<div class="sheet-head"><span style="font-size:13px;font-weight:700;color:var(--ink-3)">Pesanan & WhatsApp</span><button class="iconbtn" onclick="App.closeSheet()">${IC.x}</button></div><div class="sheet-body center"><div style="font-size:48px">✅💬</div><h2>Pesanan Dibuat & WA Dikirim!</h2>
        <p class="muted">No. <b class="kbd">${o.order_no}</b></p>
        <p class="muted small">Pesanan tersimpan & WhatsApp terbuka dengan detail lengkap. Kasir akan memproses pesananmu.</p>
        <div class="row" style="justify-content:center;margin-top:16px"><button class="btn ghost" onclick="App.closeSheet();location.hash='store'">Lanjut Belanja</button>
        <button class="btn" onclick="App.closeSheet();location.hash='orders'">Lihat Pesanan</button></div></div>`);
    }catch(e){ this.toast('Gagal: '+e.message,'err'); }
    finally{ this.state._ordering=false; }
  },

    // Tahan banting: Chart.js (CDN async) kadang belum termuat saat dashboard render pertama kali.
    // Kalau belum ada → placeholder "Memuat grafik", lalu auto-retry sampai siap. Gak pernah throw → dashboard tetap utuh.
    const draw=()=>{
      const days=[],vals=[];
      for(let i=6;i>=0;i--){ const d=new Date(); d.setDate(d.getDate()-i); const k=d.toISOString().slice(0,10);
        days.push(d.toLocaleDateString('id-ID',{weekday:'short'}));
        vals.push((s.sales||[]).filter(o=>o.created_at.startsWith(k)).reduce((a,b)=>a+Number(b.total||0),0)); }
      try{
        if(document.getElementById('salesChart')) new Chart(document.getElementById('salesChart'),{type:'bar',data:{labels:days,datasets:[{data:vals,backgroundColor:'#0061B1',borderRadius:6}]},options:{plugins:{legend:{display:false}},scales:{y:{ticks:{callback:v=>'Rp'+(v/1000)+'k'}}}}});
        if(document.getElementById('channelChart')) new Chart(document.getElementById('channelChart'),{type:'doughnut',data:{labels:['Online','Offline'],datasets:[{data:[s.online||0,s.offline||1],backgroundColor:['#0090E0','#285FF4'],borderWidth:0}]},options:{plugins:{legend:{position:'bottom'}},cutout:'62%'}});
      }catch(e){ console.warn('chart render',e); }
    };
    if(typeof Chart==='undefined'){
      const ph=(id)=>{ const w=document.getElementById(id); if(w) w.innerHTML='<p class="muted small center" style="padding:40px 0">📊 Memuat grafik…</p>'; };
      ph('chart-sales-wrap'); ph('chart-channel-wrap');
      if(this._chartWait) clearInterval(this._chartWait);
      this._chartWait=setInterval(()=>{ if(typeof Chart!=='undefined'){ clearInterval(this._chartWait); this._chartWait=null;
        const w1=document.getElementById('chart-sales-wrap'); if(w1) w1.innerHTML='<canvas id="salesChart" height="120"></canvas>';
        const w2=document.getElementById('chart-channel-wrap'); if(w2) w2.innerHTML='<canvas id="channelChart" height="160"></canvas>';
        draw(); } },200);
      return;
    }
    draw();
  },

  /* bunyi beep scan: SUKSES (ding naik guri) / GAGAL (turun kasar) — Web Audio, tanpa file */
  beep(ok=true){
    try{
      const AC=window.AudioContext||window.webkitAudioContext; if(!AC)return;
      if(!this._actx) this._actx=new AC();
      const ctx=this._actx; if(ctx.state==='suspended') ctx.resume();
      const o=ctx.createOscillator(), g=ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      const t=ctx.currentTime;
      if(ok){
        o.type='sine';
        o.frequency.setValueAtTime(1046,t);       // C6
        o.frequency.setValueAtTime(1568,t+0.07);  // G6 — ding naik, guri!
        g.gain.setValueAtTime(0.0001,t);
        g.gain.exponentialRampToValueAtTime(0.28,t+0.012);
        g.gain.exponentialRampToValueAtTime(0.0001,t+0.22);
        o.start(t); o.stop(t+0.23);
      }else{
        o.type='square';
        o.frequency.setValueAtTime(311,t); o.frequency.setValueAtTime(196,t+0.13); // turun
        g.gain.setValueAtTime(0.0001,t);
        g.gain.exponentialRampToValueAtTime(0.18,t+0.012);
        g.gain.exponentialRampToValueAtTime(0.0001,t+0.32);
        o.start(t); o.stop(t+0.33);
      }
    }catch(e){}
  },

  posTotals(){
    const sub=this.state.posCart.reduce((a,b)=>a+b.price*b.qty,0);
    const cust=this.state.posCustomer; const pts=cust?Math.min(Number(document.getElementById('pos-pts')?.value||0),cust.points,Math.floor(sub/CONFIG.REDEEM_VALUE)):0;
    const disc=pts*CONFIG.REDEEM_VALUE; const ship=this.posShip(); const baseTot=sub-disc+ship;
    // tier benefit member (diskon ke total + pengali poin) — default MATI di Pengaturan
    let tierMult=1, tierDisc=0;
    if(cust){ const tr=this.tierOf(cust.points); tierMult=tr.mult; tierDisc=(tr.on&&tr.disc>0)?Math.round(baseTot*tr.disc/100):0; }
    // piutang lama member (bisa diceklis utk masuk ke total)
    const bon=(cust&&cust._bon>0)?Number(cust._bon):0;
    const bonRow=document.getElementById('pos-bon-row');
    if(bonRow){ bonRow.classList.toggle('hide',bon<=0); const amt=document.getElementById('pos-bon-amt'); if(amt) amt.textContent=this.money(bon); }
    const bonAdd=(bon>0 && document.getElementById('pos-bon-on')?.checked)?bon:0;
    const tot=baseTot+bonAdd-tierDisc;   // grand total (belanja + piutang - diskon tier)
    document.getElementById('pos-sub').textContent=this.money(sub);
    document.getElementById('pos-disc').textContent='- '+this.money(disc+tierDisc)+(tierDisc>0?` (poin ${this.money(disc)} + tier ${this.money(tierDisc)})`:'');
    const shEl=document.getElementById('pos-ship'); if(shEl) shEl.textContent=this.money(ship);
    document.getElementById('pos-total').textContent=this.money(tot);
    const paid=Number(document.getElementById('pos-paid').value||0);
    const change=paid-tot;
    const chEl=document.getElementById('pos-change');
    if(chEl){ if(change<0){chEl.textContent='⚠️ BON '+this.money(Math.abs(change));chEl.style.color='var(--rose)';chEl.style.fontWeight='800';}
      else{chEl.textContent=this.money(change);chEl.style.color='var(--green)';chEl.style.fontWeight='';} }
    this.state._posTot={sub,disc,pts,ship,tot:baseTot-tierDisc,bonAdd,tierMult,tierDisc};
    const ep=document.getElementById('pos-est-pts'); if(ep){ const estPts=Math.floor((sub-disc)/CONFIG.EARN_PER_RP*tierMult); ep.innerHTML=cust?`<span class="tag green">🎁 +${estPts} poin${tierMult>1?` (tier x${tierMult})`:''}</span> <span class="muted small">— masuk setelah transaksi <b>selesai/dibayar</b></span>`:''; }

  async doPayBon(){
    if(this.state._bonPaying)return;
    const c=this.state._bonTarget||this.state.posCustomer; if(!c)return;
    const pay=Number(document.getElementById('bon-pay')?.value||0);
    if(pay<=0){this.toast('Masukkan nominal','err');return;}
    if(pay>c._bon){this.toast('Kelebihan! Bon cuma '+this.money(c._bon),'err');return;}
    // 🔒 lock tombol + flag (anti-dobel + feedback "memproses")
    this.state._bonPaying=true;
    const btn=document.getElementById('bon-pay-btn'); const btnOld=btn?btn.innerHTML:'';
    if(btn){btn.disabled=true;btn.innerHTML='⏳ Melunasi…';}
    const DEBT_BAD=['pending','cancelled','rejected'];
    const calcBon=arr=>arr.filter(o=>Number(o.change_amount||0)<0&&!DEBT_BAD.includes(o.status)).reduce((s,o)=>s+Math.abs(Number(o.change_amount||0)),0);
    let remaining=pay, failed=0, usedRPC=true;
    const settleOne=async(o)=>{ const bon=Math.abs(Number(o.change_amount||0)); if(bon<=0||remaining<=0||DEBT_BAD.includes(o.status))return;
      const apply=Math.min(remaining,bon);
      await DB.updateOrderStatus(o.id,o.status,{change_amount:Number(o.change_amount)+apply,paid_amount:Number(o.paid_amount||0)+apply});
      remaining-=apply; };
    try{
      // ===== PRIMER: RPC server-side settle_bon (lewati RLS, atomic FIFO) =====
      try{
        c._bon=await DB.settleBon(c.id, pay);
      }catch(e){
        if((e.message||'')!=='__NORPC__') throw e;     // error lain -> lempar
        // RPC blm dibuat -> fallback ke updateOrderStatus per-order (robust)
        usedRPC=false;
        for(const o of (await DB.listOrders({customer_id:c.id})).reverse()){ try{await settleOne(o);}catch(err){failed++;console.warn('[payBon] order',o.id,err);} if(remaining<=0)break; }
        let fr=await DB.listOrders({customer_id:c.id});
        if(remaining>0||failed>0){ for(const o of fr){ try{await settleOne(o);}catch(err){} if(remaining<=0)break; } fr=await DB.listOrders({customer_id:c.id}); }
        c._bon=calcBon(fr);
      }
      // 🔍 DIAGNOSTIK: log presisi supaya kalau bon masih lengket kita tahu persis kenapa
      const fresh=await DB.listOrders({customer_id:c.id});
      console.log('[payBon] hasil: mode='+(usedRPC?'RPC':'fallback')+' dibayar='+pay+' gagal='+failed+' bon_skrg='+c._bon, fresh.map(o=>({id:String(o.id).slice(-6),change:o.change_amount,paid:o.paid_amount,status:o.status})));
      this.renderCustInfo(); this.closeSheet();
      this.toast(c._bon<=0?'✅ BON lunas! Terima kasih 🙏':(failed>0?('⚠️ '+failed+' order blm tersimpan — bon tersisa '+this.money(c._bon)):'BON tersisa '+this.money(c._bon)), c._bon<=0?'ok':(failed>0?'err':'ok'));
      // refresh view aktif biar bon hilang dari layar (Piutang/Member/Kasir)
      if(['piutang','members','staff'].includes(this.state.view)) setTimeout(()=>{ try{ this.route(); }catch(e){} },250);
      if(this.state.posCustomer&&this.state.posCustomer.id===c.id) this.state.posCustomer._bon=c._bon;
    }catch(e){ console.error('[payBon]',e); this.toast('Gagal: '+(e.message||e),'err'); }
    finally{ this.state._bonPaying=false; if(btn){btn.disabled=false;btn.innerHTML=btnOld;} }
  },
  async posCheckout(){
    if(this.state._posChecking) return;  // 🔒 cegah transaksi dobel (lag/proses lambat)
    const c=this.state.posCart; if(!c.length){this.toast('Keranjang kosong','err');return;}
    const t=this.state._posTot; const paid=Number(document.getElementById('pos-paid').value||0);
    const bonOn=document.getElementById('pos-bon-on')?.checked && this.state.posCustomer && this.state.posCustomer._bon>0;
    const grandTot=t.tot+(bonOn?this.state.posCustomer._bon:0);
    if(paid<grandTot && !this.state.posCustomer){this.toast('Bayar kurang — pilih member dulu buat catat bon 🙂','err');return;}
    // 🔒 lock tombol + flag
    this.state._posChecking=true;
    const btn=document.getElementById('pos-checkout-btn');
    const btnOld=btn?btn.innerHTML:'';
    if(btn){btn.disabled=true;btn.innerHTML='⏳ Memproses…';}
    try{
    const cust=this.state.posCustomer;
    const ptsEarn=Math.floor((t.sub-t.disc)/CONFIG.EARN_PER_RP*(t.tierMult||1));
    // split pembayaran: lunasi piutang lama dulu, sisanya ke belanja ini
    let toDebt=0, toNew=paid;
    if(bonOn){ toDebt=Math.min(cust._bon,paid); toNew=paid-toDebt; }
    let order={ order_no:'POS'+Date.now().toString().slice(-8), customer_id:cust?cust.id:null, customer_name:cust?cust.full_name:'Tamu (Walk-in)',
      channel:'offline', status:'completed', subtotal:t.sub, discount:t.disc+(t.tierDisc||0), points_used:t.pts, points_earned:cust?ptsEarn:0, shipping:t.ship||0,
      total:t.tot, paid_amount:toNew, change_amount:toNew-t.tot, payment_method:document.getElementById('pos-pay').value,
      struk_note:document.getElementById('pos-struk-note')?.value?.trim()||'',
      cashier_id:this.state.user.id };
    let delivMsg='';
    const delivOn=document.getElementById('pos-deliv-on')?.checked;
    if(delivOn){
      const zVal=document.getElementById('pos-deliv-zone')?.value;
      let zoneNama;
      if(zVal==='lainnya'){ zoneNama='Lainnya'; }
      else{ const zi=Number(zVal); const zone=this.state._delivery?.zones?.[zi]; if(!zone){this.toast('Pilih zona antar dulu 🙂','err');return;} zoneNama=zone.nama||('Zona '+(zi+1)); }
      const addr=(document.getElementById('pos-deliv-addr')?.value||'').trim();
      if(!addr){this.toast('Isi alamat antar dulu 🙂','err');return;}
      const cv=document.getElementById('pos-deliv-courier')?.value||''; let cid=null,cname=null,cphone=null;
      if(cv){const p=cv.split('|');cid=p[0]||null;cname=p[1]||'';cphone=p[2]||'';}
      const rcvName=(document.getElementById('pos-deliv-name')?.value||'').trim();
      const rcvPhone=(document.getElementById('pos-deliv-phone')?.value||'').trim();
      order={...order, delivery_method:'antar', delivery_zone:zoneNama, address:addr,
        status:cid?'pickup':'processing', courier_id:cid, courier_name:cname, courier_phone:cphone,
        delivery_note:rcvPhone?('Penerima: '+(rcvName||order.customer_name)+' · ☎ '+rcvPhone):''};
      if(!cust&&rcvName) order.customer_name=rcvName;
      delivMsg=cid?(' — diantar oleh '+cname):' — masuk job antar kurir';
    }
      const items=c.map(it=>({product_id:it.product_id,name:it.name,price:it.price,qty:it.qty,subtotal:it.price*it.qty}));
      // 💸 lunasi piutang lama (stelah semua validasi lolos, sebelum buat order baru)
      let bonMsg='';
      if(bonOn && toDebt>0){
        try{ await DB.settleBon(cust.id,toDebt); bonMsg=' · piutang '+this.money(toDebt)+' lunas'; }
        catch(e){ console.warn('[posCheckout] settle bon gagal',e); toDebt=0; toNew=paid; order.paid_amount=paid; order.change_amount=paid-t.tot; this.toast('⚠️ Piutang blm dilunasi (transaksi tetap jalan)','err'); }
      }
        const o=await DB.createOrder(order,items);
      await DB.awardOrderPoints(o.id).catch(()=>{});   // kredit poin kalau lunas penuh (bon -> defer)
      this.state.posCart=[]; this.state.posCustomer=null; const d=document.getElementById('pos-deliv-on'); if(d)d.checked=false; this.posToggleDeliv(false);
      this.posRender(); this.renderCustInfo(); this.updateOnlineBadge();
      const _opts=bonOn?{bonIn:true,oldDebt:cust._bon,grandTotal:o.total+cust._bon,cashPaid:paid,bayarBon:toDebt,sisaBon:(cust._bon-toDebt)+(Number(o.change_amount)<0?Math.abs(Number(o.change_amount)):0)}:null;
      this.printReceipt(o,items,_opts);
      const bonAmt=Number(o.change_amount||0)<0?Math.abs(Number(o.change_amount)):0;
      this.toast(bonAmt>0?('✅ Transaksi — BON '+this.money(bonAmt)+' dicatat utk '+cust.full_name+bonMsg):('Transaksi sukses ✓ '+o.order_no+delivMsg+bonMsg),'ok');
    }catch(e){ this.toast('Gagal: '+e.message,'err'); }
    finally{
      this.state._posChecking=false;
      if(btn){btn.disabled=false;btn.innerHTML=btnOld;}
    }
  },

  openScanner(mode='product', target){
    this.state._scanMode=mode;
    if(mode==='capture') this.state._scanTarget=target||'qe-barcode';  // barcode capture -> input target
    this.stopScan();
    let ov=document.getElementById('scan-overlay');
    if(!ov){ ov=document.createElement('div'); ov.id='scan-overlay'; ov.className='scan-overlay';
      ov.onclick=(e)=>{ if(e.target===ov) this.closeScanner(); }; document.body.appendChild(ov); }
    ov.innerHTML=`<div class="scan-box">
      <div class="scan-body">
        <div class="scan-stage">
          <div id="scan-region"></div>
          <div class="scan-corners"><i></i><i></i><i></i><i></i></div>
          <div class="scan-laser"></div>
          <div class="scan-label">scan</div>
        </div>
        <div class="row" style="gap:8px;margin-top:10px">
          <button class="btn ghost sm" style="flex:1" onclick="App.stopScan()">⏸ Jeda</button>
          <button class="btn green sm" style="flex:1" onclick="App.startScan()">📷 Scan</button>
          <button class="scan-close-btn" onclick="App.closeScanner()">${IC.x}</button>
        </div>
      </div>
    </div>`;
    ov.style.display='flex';
    this.startScan();
  },
  closeScanner(){ this.stopScan(); const ov=document.getElementById('scan-overlay'); if(ov) ov.style.display='none'; },
  startScan(){
    if(!window.Html5Qrcode){ this.toast('Library scanner belum termuat','err'); return; }
    this.stopScan();
    const id='scan-region';
    this.state.scanner=new Html5Qrcode(id,{verbose:false});
    const cfg={fps:10,qrbox:{width:260,height:140},formatsToSupport:[
      Html5QrcodeSupportedFormats.EAN_13,Html5QrcodeSupportedFormats.EAN_8,
      Html5QrcodeSupportedFormats.UPC_A,Html5QrcodeSupportedFormats.UPC_E,
      Html5QrcodeSupportedFormats.CODE_128,Html5QrcodeSupportedFormats.CODE_39]};
    this.state.scanner.start({facingMode:'environment'},cfg,(code)=>this.onScan(code))
      .catch(e=>{ this.toast('Tidak bisa akses kamera: '+e,'err'); });
  },
  onScan(code){
    if(this.state._lastScan && Date.now()-this.state._lastScan<1500)return;
    this.state._lastScan=Date.now();
    if(this.state._scanMode==='member'){ this.scanMember(code); return; }
    if(this.state._scanMode==='capture'){ const inp=document.getElementById(this.state._scanTarget||'qe-barcode'); if(inp){ inp.value=code; this.beep(true); } this.closeScanner(); this.toast('Barcode ter-scan: '+code,'ok'); return; }
    this.posBarcode(code);
    this.toast('Scanned: '+code,'ok');
  },
  /* scan kartu member: QR "MEMBER:<id>" atau barcode referral_code */
  async scanMember(code){
    code=(code||'').trim(); if(!code)return;
    let member=null;
    if(code.startsWith('MEMBER:')){ member=await DB.getMember(code.slice(7)).catch(()=>null); }
    else { const list=await DB.listMembers(''); member=list.find(m=>(m.referral_code||'').toUpperCase()===code.toUpperCase())||null; }
    if(!member){ this.beep(false); this.toast('Member tidak ditemukan ('+code+')','err'); return; }
    this.beep(true);
    this.state.posCustomer=member; this.renderCustInfo(); this.posTotals();
    this.closeScanner(); this.closeSheet();
    this.toast('Member: '+member.full_name+' ✓','ok');
  },
  stopScan(){ if(this.state.scanner){ try{ this.state.scanner.stop().then(()=>this.state.scanner.clear()); }catch(e){} this.state.scanner=null; } },

  rakAutoEmoji(i,catId){
    // kalau emoji masih default (📦 atau ikut kategori lama), ikutin kategori baru
    const cats=this.state._cats||[]; const cat=cats.find(c=>c.id===catId);
    if(!cat)return; const cur=this.state._rakRows[i]?.emoji;
    const catIcons=cats.map(c=>c.icon);
    if(!cur||cur==='📦'||catIcons.includes(cur)){ this.state._rakRows[i].emoji=cat.icon||'📦'; const btn=document.getElementById('rak-em-'+i); if(btn) btn.textContent=cat.icon||'📦'; }
